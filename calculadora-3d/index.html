<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5a1f">
<title>Calculadora de Precificação 3D</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <header>
    <h1>Calculadora de Precificação 3D</h1>
    <p id="cabecalhoRegras">Shopee · Mercado Livre · TikTok Shop</p>
    <div class="salvas" id="salvas"></div>
  </header>

  <!-- 1. A peça ------------------------------------------------------ -->
  <details class="card" id="secPeca" open>
    <summary><span class="num">1</span> A peça <span class="resumo" id="resumoPeca"></span></summary>
    <div class="corpo">

      <label class="campo">
        <span>Nome da peça</span>
        <input id="nome" type="text" placeholder="Ex.: Suporte de fone" autocomplete="off">
      </label>

      <div id="materiais"></div>
      <button class="link-btn" id="addMaterial" type="button">+ adicionar material</button>

      <div class="linha tres">
        <label class="campo">
          <span>Horas</span>
          <input id="horas" type="number" inputmode="decimal" step="any" min="0" value="4">
        </label>
        <label class="campo">
          <span>Minutos</span>
          <input id="minutos" type="number" inputmode="numeric" step="any" min="0" value="0">
        </label>
        <label class="campo">
          <span>Peças/placa</span>
          <input id="pecasPorImpressao" type="number" inputmode="numeric" step="1" min="1" value="1">
        </label>
      </div>

      <div class="linha tres">
        <label class="campo">
          <span>Acabamento (min)</span>
          <input id="minutosTrabalho" type="number" inputmode="decimal" step="any" min="0" value="5">
        </label>
        <label class="campo">
          <span>Insumos extras</span>
          <span class="pre" data-prefixo="R$"><input id="extras" type="number" inputmode="decimal" step="any" min="0" value="0"></span>
        </label>
        <label class="campo">
          <span>Embalagem</span>
          <span class="pre" data-prefixo="R$"><input id="embalagem" type="number" inputmode="decimal" step="any" min="0" value="1"></span>
        </label>
      </div>

    </div>
  </details>

  <!-- 2. Minha operação ---------------------------------------------- -->
  <details class="card" id="secOperacao">
    <summary><span class="num">2</span> Minha operação <span class="resumo" id="resumoOperacao"></span></summary>
    <div class="corpo">
      <p class="nota">Preenche uma vez — fica salvo no aparelho.</p>

      <div class="linha">
        <label class="campo">
          <span>Potência (W)</span>
          <input id="potenciaW" type="number" inputmode="decimal" step="any" min="0" value="150">
        </label>
        <label class="campo">
          <span>Energia (kWh)</span>
          <span class="pre" data-prefixo="R$"><input id="tarifaKwh" type="number" inputmode="decimal" step="any" min="0" value="0.95"></span>
        </label>
      </div>

      <div class="linha tres">
        <label class="campo">
          <span>Valor da impressora</span>
          <span class="pre" data-prefixo="R$"><input id="valorImpressora" type="number" inputmode="decimal" step="any" min="0" value="3000"></span>
        </label>
        <label class="campo">
          <span>Vida útil (h)</span>
          <input id="vidaUtilHoras" type="number" inputmode="decimal" step="any" min="0" value="6000">
        </label>
        <label class="campo">
          <span>Manutenção/h</span>
          <span class="pre" data-prefixo="R$"><input id="manutencaoHora" type="number" inputmode="decimal" step="any" min="0" value="0.20"></span>
        </label>
      </div>

      <div class="linha tres">
        <label class="campo">
          <span>Sua hora de trabalho</span>
          <span class="pre" data-prefixo="R$"><input id="valorHoraTrabalho" type="number" inputmode="decimal" step="any" min="0" value="30"></span>
        </label>
        <label class="campo">
          <span>Taxa de falha (%)</span>
          <input id="taxaFalhaPct" type="number" inputmode="decimal" step="any" min="0" max="95" value="7">
        </label>
        <label class="campo">
          <span>Custo fixo/h</span>
          <span class="pre" data-prefixo="R$"><input id="custoFixoHora" type="number" inputmode="decimal" step="any" min="0" value="0"></span>
          <span class="dica">Aluguel, internet etc. rateados por hora de máquina.</span>
        </label>
      </div>

    </div>
  </details>

  <!-- 3. Objetivo de venda ------------------------------------------- -->
  <details class="card" id="secVenda" open>
    <summary><span class="num">3</span> Objetivo de venda <span class="resumo" id="resumoVenda"></span></summary>
    <div class="corpo">

      <div class="campo">
        <span>Quero definir por</span>
        <div class="chips" id="modoObjetivo">
          <button type="button" data-modo="margem" aria-pressed="true">Margem %</button>
          <button type="button" data-modo="markup">Markup %</button>
          <button type="button" data-modo="lucro">Lucro R$</button>
          <button type="button" data-modo="preco">Preço fixo</button>
        </div>
      </div>

      <label class="campo" id="wrapObjetivo">
        <span id="rotuloObjetivo">Margem desejada sobre a venda (%)</span>
        <input id="valorObjetivo" type="number" inputmode="decimal" step="any" value="30">
        <span class="dica" id="dicaObjetivo">Margem líquida: o que sobra sobre o preço final, já sem taxas e custos.</span>
      </label>

      <div class="linha tres">
        <label class="campo">
          <span>Imposto (%)</span>
          <input id="impostoPct" type="number" inputmode="decimal" step="any" min="0" value="0">
          <span class="dica">MEI: 0. Simples: use sua alíquota.</span>
        </label>
        <label class="campo">
          <span>Ads (%)</span>
          <input id="adsPct" type="number" inputmode="decimal" step="any" min="0" value="0">
        </label>
        <label class="campo">
          <span>Antecipação (%)</span>
          <input id="antecipacaoPct" type="number" inputmode="decimal" step="any" min="0" value="0">
        </label>
      </div>

      <label class="campo">
        <span>Arredondar preço para</span>
        <select id="terminacao">
          <option value="">Não arredondar</option>
          <option value="90" selected>Terminar em ,90</option>
          <option value="99">Terminar em ,99</option>
          <option value="50">Terminar em ,50</option>
        </select>
      </label>

    </div>
  </details>

  <!-- 4. Marketplaces ------------------------------------------------- -->
  <details class="card" id="secMarketplaces">
    <summary><span class="num">4</span> Marketplaces <span class="resumo" id="resumoMp"></span></summary>
    <div class="corpo">

      <label class="switch">
        <input type="checkbox" id="mpShopee" checked>
        <span>Shopee <span class="sub">20% até R$79,99 · 14% + taxa fixa acima</span></span>
      </label>
      <div class="linha">
        <label class="campo">
          <span>Frete que você paga</span>
          <span class="pre" data-prefixo="R$"><input id="shopeeFrete" type="number" inputmode="decimal" step="any" min="0" value="0"></span>
        </label>
      </div>
      <label class="switch">
        <input type="checkbox" id="shopeeCpf">
        <span>Vendo como CPF com +450 pedidos/90 dias <span class="sub">soma R$3 por item</span></span>
      </label>

      <hr style="border:none;border-top:1px solid var(--borda);margin:16px 0 0">

      <label class="switch">
        <input type="checkbox" id="mpMl" checked>
        <span>Mercado Livre <span class="sub">comissão + custo por unidade abaixo de R$79</span></span>
      </label>
      <div class="linha tres">
        <label class="campo">
          <span>Tipo de anúncio</span>
          <select id="mlTipo">
            <option value="classico" selected>Clássico</option>
            <option value="premium">Premium</option>
          </select>
        </label>
        <label class="campo">
          <span>Comissão (%)</span>
          <input id="mlPct" type="number" inputmode="decimal" step="any" min="0" value="12">
        </label>
        <label class="campo">
          <span>Frete que você paga</span>
          <span class="pre" data-prefixo="R$"><input id="mlFrete" type="number" inputmode="decimal" step="any" min="0" value="0"></span>
          <span class="dica">Acima de R$79 o frete grátis sai do seu bolso.</span>
        </label>
      </div>

      <hr style="border:none;border-top:1px solid var(--borda);margin:16px 0 0">

      <label class="switch">
        <input type="checkbox" id="mpTiktok" checked>
        <span>TikTok Shop <span class="sub">10% + R$4 abaixo de R$50 · 6% + R$6 acima</span></span>
      </label>
      <div class="linha">
        <label class="campo">
          <span>Afiliado (%)</span>
          <input id="tkAfiliado" type="number" inputmode="decimal" step="any" min="0" value="0">
        </label>
        <label class="campo">
          <span>Frete que você paga</span>
          <span class="pre" data-prefixo="R$"><input id="tkFrete" type="number" inputmode="decimal" step="any" min="0" value="0"></span>
        </label>
      </div>
      <label class="switch">
        <input type="checkbox" id="tkFreteGratis" checked>
        <span>Programa de Frete Grátis <span class="sub">soma 6% sobre o preço</span></span>
      </label>

    </div>
  </details>

  <!-- Resultados ------------------------------------------------------ -->
  <section id="resultados" aria-live="polite"></section>

  <details class="card" id="secCusto">
    <summary><span class="num">R$</span> Como o custo foi formado <span class="resumo" id="resumoCusto"></span></summary>
    <div class="corpo">
      <ul id="detalheCusto" style="list-style:none;margin:0;padding:0;font-size:0.9rem"></ul>
    </div>
  </details>

  <p class="nota" id="rodapeRegras"></p>

</div>

<div class="barra">
  <div class="interno">
    <div class="bloco">
      <span>Custo</span>
      <b id="barraCusto">R$ 0,00</b>
    </div>
    <div class="bloco">
      <span id="barraMelhorRotulo">Melhor preço</span>
      <b id="barraMelhor">—</b>
    </div>
    <div class="acoes">
      <button type="button" id="btnSalvar">Salvar</button>
      <button type="button" id="btnCompartilhar" class="principal">Enviar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
