<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark light" />
<title>Leak Test | Powertrain — Monitor de Estanqueidade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230ea5e9'/%3E%3Cpath d='M50 18 C34 40 26 52 26 62 a24 24 0 0 0 48 0 c0-10-8-22-24-44z' fill='white'/%3E%3C/svg%3E" />
<meta name="theme-color" content="#0b1220" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Leak Test" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />

<style>
/* ============ RESET / BASE ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1220; --bg-2:#0e1728; --panel:#0f1830; --panel-2:#152341;
  --line:#22304f; --line-2:#2c3d63;
  --txt:#e8edf7; --muted:#9fb0cc; --faint:#7286a8;
  --brand:#38bdf8; --brand-2:#7dd3fc; --accent:#14b8a6;
  --ok:#22c55e; --ok-bg:rgba(34,197,94,.14);
  --warn:#f59e0b; --warn-bg:rgba(245,158,11,.15);
  --bad:#ef4444; --bad-bg:rgba(239,68,68,.15);
  --shadow:0 18px 42px -22px rgba(0,0,0,.85);
  --radius:18px; --radius-sm:11px;
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  --num:'Inter',system-ui,Segoe UI,Roboto,Arial,sans-serif;
  --esc:1;                       /* escala do painel (config) */
}
:root[data-theme="light"]{
  --bg:#eef2f8; --bg-2:#e6ecf5; --panel:#ffffff; --panel-2:#f4f7fc;
  --line:#dbe3ef; --line-2:#c7d3e5;
  --txt:#0f1b32; --muted:#4a5b78; --faint:#6b7c99;
  --shadow:0 14px 32px -20px rgba(20,40,80,.45);
}
html,body{height:100%}
body{
  background:
    radial-gradient(1300px 720px at 88% -12%, color-mix(in srgb, var(--brand) 13%, transparent), transparent 60%),
    radial-gradient(1000px 640px at -8% 112%, color-mix(in srgb, var(--accent) 11%, transparent), transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--txt);font-family:var(--font);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
svg{width:18px;height:18px;flex:none}
::selection{background:color-mix(in srgb,var(--brand) 40%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:20px;border:3px solid transparent;background-clip:content-box}
.tnum{font-variant-numeric:tabular-nums}

/* ============ PAINEL ============ */
.painel{min-height:100vh;display:flex;flex-direction:column;padding:clamp(10px,1.1vw,18px);gap:clamp(9px,.9vw,14px)}
@media (min-width:1000px) and (min-height:640px){ .painel{height:100vh;overflow:hidden} }

/* ---- Cabeçalho ---- */
.ph{display:flex;align-items:center;gap:clamp(10px,1.1vw,18px);flex-wrap:wrap;
  padding:clamp(9px,.8vw,14px) clamp(12px,1.1vw,20px);
  background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.ph-logo{width:calc(52px * var(--esc));height:calc(52px * var(--esc));border-radius:15px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--brand),var(--accent));color:#04121f;
  box-shadow:0 10px 24px -10px var(--brand)}
.ph-logo svg{width:60%;height:60%}
.ph-tit{min-width:0}
.ph-tit h1{font-size:calc(clamp(21px,2.3vw,40px) * var(--esc));font-weight:800;letter-spacing:-.02em;line-height:1.05;white-space:nowrap}
.ph-tit h1 span{color:var(--brand)}
.ph-tit p{color:var(--muted);font-size:calc(clamp(10.5px,.82vw,14px) * var(--esc));font-weight:600;margin-top:3px}
.ph .sp{flex:1 1 auto}
.seg{display:flex;gap:3px;padding:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px}
.seg button{padding:5px 11px;border-radius:9px;font-size:calc(12px * var(--esc));font-weight:700;color:var(--muted);transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:color-mix(in srgb,var(--brand) 20%,transparent);color:var(--brand-2)}
.ph-clock{text-align:right;line-height:1.05}
.ph-clock b{display:block;font-size:calc(clamp(20px,2vw,34px) * var(--esc));font-weight:800;letter-spacing:-.02em}
.ph-clock small{display:block;color:var(--muted);font-size:calc(clamp(10px,.75vw,13px) * var(--esc));font-weight:700;margin-top:2px}
.ph-btns{display:flex;gap:6px;flex-wrap:wrap}
.ib{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--muted);
  background:var(--panel-2);border:1px solid var(--line);transition:.15s}
.ib:hover{color:var(--txt);border-color:var(--faint);transform:translateY(-1px)}
.ib.on{color:var(--brand-2);border-color:color-mix(in srgb,var(--brand) 45%,transparent);background:color-mix(in srgb,var(--brand) 16%,transparent)}
.ib.off{color:var(--faint)}
.ib svg{width:16px;height:16px}
.ib.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- Grade de cards ---- */
.cards{flex:1;min-height:0;display:grid;gap:clamp(9px,.85vw,14px);align-items:stretch;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,calc(280px * var(--esc))),1fr))}
.cards.c1{grid-template-columns:1fr}
.cards.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.cards.c4{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}

.card{--c:var(--brand);--b:var(--c);position:relative;display:flex;flex-direction:column;gap:calc(7px * var(--esc));
  padding:calc(clamp(11px,.95vw,18px) * var(--esc));border-radius:var(--radius);
  border:2px solid color-mix(in srgb,var(--b) 55%,transparent);
  background:
    linear-gradient(180deg,color-mix(in srgb,var(--b) 11%,transparent),transparent 42%),
    color-mix(in srgb,var(--panel) 92%,transparent);
  box-shadow:var(--shadow);overflow:hidden;transition:border-color .25s,box-shadow .25s}
.card.st-warn{--b:var(--warn)}
.card.st-bad{--b:var(--bad);box-shadow:var(--shadow),0 0 0 1px color-mix(in srgb,var(--bad) 25%,transparent)}
.card.st-off{--b:var(--faint);opacity:.72}
.card.alarme{animation:pulsa 1.5s ease-in-out infinite}
@keyframes pulsa{0%,100%{box-shadow:var(--shadow),0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}
  50%{box-shadow:var(--shadow),0 0 0 9px transparent}}

/* nenhuma faixa do card pode encolher: senão a tendência some em telas cheias */
.card>*{flex-shrink:0}
.c-head{display:flex;align-items:center;gap:9px}
.c-ico{width:calc(34px * var(--esc));height:calc(34px * var(--esc));border-radius:10px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--b) 18%,transparent);color:var(--b);
  border:1px solid color-mix(in srgb,var(--b) 35%,transparent)}
.c-ico svg{width:58%;height:58%}
.c-head h2{font-size:calc(clamp(16px,1.35vw,25px) * var(--esc));font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--b)}
.c-head small{display:block;color:var(--muted);font-size:calc(clamp(9.5px,.66vw,12px) * var(--esc));font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;margin-top:1px}

.pill{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;max-width:100%;
  padding:calc(6px * var(--esc)) calc(13px * var(--esc));border-radius:99px;
  font-size:calc(clamp(11px,.82vw,14.5px) * var(--esc));font-weight:800;line-height:1.15}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;opacity:.9}
.pill.ok{background:var(--ok);color:#04240f}
.pill.warn{background:var(--warn);color:#2a1a00}
.pill.bad{background:var(--bad);color:#2b0505}
.pill.off{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}

.big{display:flex;align-items:baseline;gap:8px;line-height:.92;margin-top:calc(-2px * var(--esc))}
.big b{font-family:var(--num);font-size:calc(clamp(40px,4.6vw,84px) * var(--esc));font-weight:800;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums}
.big span{font-size:calc(clamp(13px,1.05vw,20px) * var(--esc));font-weight:800;color:var(--muted)}
.sub{color:var(--muted);font-size:calc(clamp(10.5px,.78vw,14px) * var(--esc));font-weight:700;margin-top:calc(-4px * var(--esc))}
.sub b{color:var(--txt)}
.sub .nok{color:var(--bad)}

.meta-l{display:flex;align-items:baseline;gap:8px;font-size:calc(clamp(10.5px,.8vw,14.5px) * var(--esc));font-weight:800}
.meta-l .mt{color:var(--txt)}
.meta-l .mn{color:var(--muted);font-weight:700}
.meta-l .pc{margin-left:auto;font-variant-numeric:tabular-nums}
.bar{height:calc(7px * var(--esc));border-radius:99px;background:color-mix(in srgb,var(--line) 75%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .5s ease}
.card.st-warn .bar i{background:var(--warn)}
.card.st-bad .bar i{background:var(--bad)}

.lbl-s{font-size:calc(clamp(9.5px,.66vw,12px) * var(--esc));font-weight:800;color:var(--faint);
  text-transform:uppercase;letter-spacing:.7px;display:flex;align-items:center;gap:6px}
.lbl-s::after{content:"";flex:1;height:1px;background:var(--line)}

.chips{display:flex;flex-direction:column;gap:calc(4px * var(--esc))}
.chips.linha{flex-direction:row;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:8px;align-self:flex-start;max-width:100%;
  padding:calc(4px * var(--esc)) calc(11px * var(--esc));border-radius:99px;
  background:color-mix(in srgb,var(--panel-2) 85%,transparent);border:1px solid var(--line);
  font-size:calc(clamp(11px,.82vw,15px) * var(--esc));font-weight:700;line-height:1.25}
.chip i{width:8px;height:8px;border-radius:2px;background:var(--brand);flex:none}
.chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip .vl,.chip .of{white-space:nowrap}
.chip .vl{font-weight:800;font-variant-numeric:tabular-nums}
.chip .vl.ok{color:var(--ok)}.chip .vl.warn{color:var(--warn)}.chip .vl.bad{color:var(--bad)}
.chip .of{color:var(--faint);font-weight:700}

.box-nok{display:flex;align-items:center;gap:10px;padding:calc(8px * var(--esc)) calc(12px * var(--esc));
  border-radius:13px;background:var(--bad-bg);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);
  font-size:calc(clamp(11px,.8vw,14.5px) * var(--esc));font-weight:800}
.box-nok.calmo{background:color-mix(in srgb,var(--panel-2) 85%,transparent);border-color:var(--line)}
.box-nok .nm{color:var(--muted);font-weight:700;line-height:1.15}
.box-nok .vl{margin-left:auto;text-align:right;color:var(--bad);font-variant-numeric:tabular-nums;white-space:nowrap}
.box-nok.calmo .vl{color:var(--txt)}
.box-nok .vl small{display:block;color:var(--faint);font-weight:700;font-size:.72em}
.box-nok svg{width:calc(15px * var(--esc));height:calc(15px * var(--esc));color:var(--bad)}

.spark{display:flex;align-items:flex-end;gap:2px;height:calc(26px * var(--esc));margin-top:1px}
.spark i{flex:1;min-width:2px;border-radius:2px 2px 0 0;background:color-mix(in srgb,var(--ok) 70%,transparent)}
.spark i.w{background:color-mix(in srgb,var(--warn) 75%,transparent)}
.spark i.b{background:color-mix(in srgb,var(--bad) 80%,transparent)}
.spark i.v{background:var(--line)}
.hist-vazio{color:var(--faint);font-size:calc(clamp(10px,.72vw,13px) * var(--esc));font-weight:700;font-style:italic}

.c-foot{margin-top:auto;display:flex;align-items:center;gap:9px;
  padding:calc(8px * var(--esc)) calc(12px * var(--esc));border-radius:13px;
  background:color-mix(in srgb,var(--b) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--b) 30%,transparent)}
.c-foot svg{width:calc(16px * var(--esc));height:calc(16px * var(--esc));color:var(--b)}
.c-foot b{font-size:calc(clamp(12.5px,.92vw,18px) * var(--esc));font-weight:800;color:var(--b);white-space:nowrap}
.c-foot small{display:block;color:var(--muted);font-size:calc(clamp(9.5px,.68vw,12px) * var(--esc));font-weight:700;margin-top:1px}

/* ---- Rodapé ---- */
.pf{display:flex;align-items:center;gap:clamp(10px,1.4vw,26px);flex-wrap:wrap;
  padding:calc(8px * var(--esc)) clamp(12px,1.1vw,20px);
  background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
  font-size:calc(clamp(10.5px,.78vw,14px) * var(--esc));font-weight:700;color:var(--muted)}
.pf .sp{flex:1}
.pf-i{display:flex;align-items:center;gap:7px;white-space:nowrap}
.pf-i svg{width:calc(14px * var(--esc));height:calc(14px * var(--esc));color:var(--faint)}
.pf-i b{color:var(--txt);font-variant-numeric:tabular-nums}
.pf-i .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.pf-i .dot.off{background:var(--faint);box-shadow:0 0 0 3px rgba(114,134,168,.15)}
.pf-i .dot.err{background:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}
.pf-i.click{cursor:pointer}
.pf-i.click:hover b,.pf-i.click:hover{color:var(--brand-2)}

/* ============ MODAIS ============ */
.ov{position:fixed;inset:0;background:rgba(4,9,20,.72);backdrop-filter:blur(4px);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:860px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin:auto;animation:up .2s}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);border-radius:var(--radius) var(--radius) 0 0;z-index:2}
.modal-head h3{font-size:16px;font-weight:800;flex:1}
.modal-head svg{color:var(--brand)}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:var(--radius-sm);
  font-weight:700;font-size:13px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--txt);transition:.15s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:var(--faint);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 60%,var(--accent)));color:#04121f;border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:6px 11px;font-size:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.field input,.field select{padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--line-2);
  background:var(--panel-2);color:var(--txt);outline:none;width:100%}
.field input:focus,.field select:focus{border-color:var(--brand)}
.field .hint{font-size:11px;color:var(--faint);font-weight:600}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.sw{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);
  background:var(--panel-2);border:1px solid var(--line);cursor:pointer}
.sw input{width:17px;height:17px;accent-color:var(--brand);cursor:pointer;flex:none}
.sw span{font-size:13px;font-weight:700}
.sw small{display:block;color:var(--faint);font-size:11px;font-weight:600}
.mgrp{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;display:flex;flex-direction:column;gap:12px}
.mgrp>h4{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}
.mgrp>h4 i{width:10px;height:10px;border-radius:3px;flex:none}
.tbl-wrap{overflow:auto;max-height:52vh;border:1px solid var(--line);border-radius:var(--radius-sm)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px}
table.tbl th{position:sticky;top:0;background:var(--panel-2);color:var(--muted);text-align:left;
  padding:9px 12px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;z-index:1}
table.tbl td{padding:8px 12px;border-top:1px solid var(--line);white-space:nowrap}
table.tbl tbody tr:hover{background:var(--panel-2)}
td .tag{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:800}
td .tag.ok{background:var(--ok-bg);color:var(--ok)}
td .tag.nok{background:var(--bad-bg);color:var(--bad)}
.drop{border:2px dashed var(--line-2);border-radius:var(--radius-sm);padding:26px;text-align:center;color:var(--muted);
  font-weight:700;font-size:13px;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--brand);color:var(--brand-2);background:color-mix(in srgb,var(--brand) 8%,transparent)}
.drop svg{width:26px;height:26px;margin-bottom:8px;color:var(--faint)}
code.k{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11.5px;color:var(--brand-2)}
.aviso{display:flex;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;
  background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--txt)}
.aviso svg{color:var(--warn);flex:none}

/* ============ TOASTS ============ */
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:9px;z-index:90}
.toast{display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:var(--radius-sm);
  background:var(--panel-2);border:1px solid var(--line-2);box-shadow:var(--shadow);
  font-size:13px;font-weight:700;max-width:min(90vw,380px);animation:up .2s}
.toast svg{width:17px;height:17px}
.toast.ok svg{color:var(--ok)}.toast.err svg{color:var(--bad)}.toast.info svg{color:var(--brand)}

/* ============ RESPONSIVO / TV ============ */
@media (max-width:720px){
  .ph{gap:9px;padding:10px 12px}
  .ph-tit h1{white-space:normal;font-size:20px}
  .ph-logo{order:-2}
  .ph-clock{order:-1;margin-left:auto}
  .cards{grid-template-columns:1fr}
  .modal-foot{flex-direction:column-reverse}
  .modal-foot .btn{justify-content:center}
}
@media (min-width:1900px){ :root{--esc:1.18} }
@media (min-width:2500px){ :root{--esc:1.42} }
:root[data-esc="p"]{--esc:.88} :root[data-esc="m"]{--esc:1} :root[data-esc="g"]{--esc:1.2} :root[data-esc="gg"]{--esc:1.45}
@media print{ body{background:#fff} .ph-btns,.pf{display:none} }
</style>
</head>
<body>

<div class="painel">
  <header class="ph">
    <div class="ph-logo" id="phLogo"></div>
    <div class="ph-tit">
      <h1>Leak Test <span>| Powertrain</span></h1>
      <p>Usinagem Bloco &amp; Cabeçote · Montagem Leak Zero &amp; Water Leak — painel de acompanhamento</p>
    </div>
    <div class="sp"></div>
    <div class="seg" id="segPeriodo"></div>
    <div class="ph-clock">
      <b id="relogio" class="tnum">--:--</b>
      <small id="dataHoje">—</small>
    </div>
    <div class="ph-btns" id="phBtns"></div>
  </header>

  <main class="cards" id="cards"></main>

  <footer class="pf">

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
const semAcento = s => String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const nInt = n => (isFinite(n)?Math.round(n):0).toLocaleString('pt-BR');
const n1 = n => (isFinite(n)?n:0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const n2 = n => (isFinite(n)?n:0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const hhmm = d => d? d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '—';
const dtBR = d => d? d.toLocaleDateString('pt-BR')+' '+hhmm(d) : '—';

function numBR(v){
  if(v==null) return NaN;
  if(typeof v==='number') return v;
  let s=String(v).trim().replace(/\s|[a-zA-Z%/]+$/g,'');
  if(!s) return NaN;
  if(s.includes(',')&&s.includes('.')) s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if(s.includes(',')) s = s.replace(',','.');
  const n = parseFloat(s);
  return isFinite(n)? n : NaN;
}
function duracao(ms){
  if(!isFinite(ms)||ms<0) return '—';
  const min = ms/60000;
  if(min<1) return 'agora';
  if(min<60) return Math.round(min)+' min';
  const h = min/60;
  if(h<48) return n1(h).replace(/,0$/,'')+' h';
  return Math.round(h/24)+' dias';
}

  a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),400);
}

function mescla(base, novo){
  if(!novo || typeof novo!=='object') return base;
  const out = {...base};
  for(const k of Object.keys(novo)){
    if(novo[k]==null) continue;
    if(k==='postos'){
      out.postos = {...base.postos};
      for(const p of Object.keys(novo.postos||{})) out.postos[p] = {...(base.postos[p]||{}), ...novo.postos[p]};
    } else if(k==='turnos' && Array.isArray(novo.turnos) && novo.turnos.length){
      out.turnos = novo.turnos;
    } else if(typeof novo[k]!=='object'){
      out[k] = novo[k];
    }
  }
  return out;
}

/* ============================================================
   LEITURA DO CSV
   ============================================================ */
function detectarSep(linha){
  const cands = [';','\t','|',','];
  let melhor=';', max=-1;
  for(const c of cands){
    let n=0, dentro=false;
    for(let i=0;i<linha.length;i++){
      const ch=linha[i];
      if(ch==='"') dentro=!dentro;
      else if(ch===c && !dentro) n++;
    }
    if(n>max){ max=n; melhor=c; }
  }
  return max>0? melhor : ';';
}
function parseCSV(texto){
  let t = String(texto||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n').trim();
  if(!t) return { cols:[], linhas:[] };
  const sep = detectarSep(t.split('\n')[0]);
  const linhas=[]; let campo='', linha=[], dentro=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(dentro){
      if(ch==='"'){ if(t[i+1]==='"'){ campo+='"'; i++; } else dentro=false; }
      else campo+=ch;
    } else {
      if(ch==='"') dentro=true;
      else if(ch===sep){ linha.push(campo); campo=''; }
      else if(ch==='\n'){ linha.push(campo); linhas.push(linha); linha=[]; campo=''; }
      else campo+=ch;
    }
  }
  linha.push(campo); linhas.push(linha);
  const cab = (linhas.shift()||[]).map(c=>c.trim());
  const cols = cab.map(semAcento);
  const out = [];
  for(const l of linhas){
    if(!l.length || l.every(c=>!String(c).trim())) continue;
    const o = {};
    cols.forEach((c,i)=>{ if(c) o[c] = (l[i]==null?'':String(l[i]).trim()); });
    o.__orig = cab;
    out.push(o);
  }
  return { cols, linhas:out, sep };
}

function pega(reg, chave){

}
/* devolve também qual coluna casou — usado para separar "reteste S/N" de "tentativa 1,2,3" */
function pegaCampo(reg, chave){
  for(const a of ALIAS[chave]){ if(reg[a]!=null && reg[a]!=='') return { col:a, val:reg[a] }; }
  return { col:'', val:'' };
}

function parseData(v){
  if(!v) return null;
  const s = String(v).trim();
  if(/^\d{13}$/.test(s)) return new Date(+s);
  if(/^\d{10}$/.test(s)) return new Date(+s*1000);
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0));
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    let ano = +m[3]; if(ano<100) ano += ano<70? 2000 : 1900;
    return new Date(ano, +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0), +(m[6]||0));
  }
  m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  if(m){ const d=new Date(); d.setHours(+m[1], +m[2], +(m[3]||0), 0); return d; }
  const d = new Date(s);
  return isNaN(d)? null : d;
}
function normPosto(txt){
  const s = semAcento(txt);
  if(!s) return '';
  if(POSTO_BY[String(txt).trim().toUpperCase()]) return String(txt).trim().toUpperCase();
  if(/water|agua|arrefec|refrig|d'?agua/.test(s)) return 'MON_WATER';
  if(/leak\s*zero|zero\s*leak|leakzero|estanqueidade\s*zero|\bzero\b/.test(s)) return 'MON_ZERO';
  if(/cabecote|cabeca|head|tampa\s*de\s*cilindro/.test(s)) return 'USI_CABECOTE';
  if(/bloco|block|monobloco|carcaca/.test(s)) return 'USI_BLOCO';
  return '';
}
function normRes(txt){
  const s = semAcento(txt);
  if(!s) return '';
  if(/^(ok|pass|passa|aprov|approved|bom|conforme|good|a|p|1|sim|s|g)$/.test(s)) return 'OK';
  if(/^(nok|ng|n\.?ok|fail|falha|reprov|rejeit|ruim|nc|nao conforme|r|f|0|nao|n|refugo)$/.test(s)) return 'NOK';
  if(/nok|ng|fail|reprov|rejeit|refug|nao conforme|vazando|vazamento alto/.test(s)) return 'NOK';
  if(/ok|pass|aprov|conforme/.test(s)) return 'OK';
  return '';
}
/* Coluna de contagem (tentativa/ciclo/passagem) só é reteste a partir da 2ª;
   coluna booleana (reteste/retrabalho) aceita S/Sim/1/X. */
function ehReteste(campo){
  if(!campo.val) return false;
  if(/tentativa|ciclo|passagem|repeticao/.test(campo.col)){ const n = numBR(campo.val); return isFinite(n)? n>1 : ehVerdade(campo.val); }
  return ehVerdade(campo.val);
}
function ehVerdade(txt){
  const s = semAcento(txt);
  if(!s) return false;
  if(/^(s|sim|y|yes|true|verdadeiro|x|1)$/.test(s)) return true;
  const n = numBR(s);
  return isFinite(n) && n>1;   // tentativa/ciclo 2, 3… = reteste
}

/* Converte as linhas cruas em registros normalizados */
function normalizar(linhas){
  const regs=[]; let ignorados=0, semData=0;
  for(const l of linhas){
    const posto = normPosto(pega(l,'posto')) || normPosto(pega(l,'peca')) || normPosto(pega(l,'maquina')) || normPosto(pega(l,'linha'));
    if(!posto){ ignorados++; continue; }
    const ts = parseData(pega(l,'data'));
    if(!ts) semData++;
    let res = normRes(pega(l,'res'));
    const valor = numBR(pega(l,'valor'));
    const limite = numBR(pega(l,'limite'));
    if(!res && isFinite(valor) && isFinite(limite)) res = valor>limite? 'NOK':'OK';   // deduz pelo valor medido
    if(!res) res = 'OK';
    const motivo = String(pega(l,'motivo')||'').trim();
    regs.push({
      ts, posto, res,
      modelo: String(pega(l,'modelo')||'').trim(),
      serie: String(pega(l,'serie')||'').trim(),
      valor: isFinite(valor)? valor : NaN,
      limite: isFinite(limite)? limite : NaN,
      unid: String(pega(l,'unid')||'').trim(),
      motivo: res==='NOK'? (motivo||'Não informado') : motivo,
      turno: String(pega(l,'turno')||'').trim(),
      operador: String(pega(l,'operador')||'').trim(),
      maquina: String(pega(l,'maquina')||'').trim(),
      reteste: ehReteste(pegaCampo(l,'reteste')),
    });
  }
  // Sem data em nenhuma linha: distribui no tempo para não esconder tudo nos filtros
  if(semData){
    const base = Date.now() - regs.length*30000;
    regs.forEach((r,i)=>{ if(!r.ts) r.ts = new Date(base + i*30000); });
  }
  regs.sort((a,b)=> a.ts - b.ts);
  return { regs, ignorados, semData };
}

/* ============================================================
   PERÍODOS E TURNOS
   ============================================================ */
function hm(str){ const m=String(str||'').match(/^(\d{1,2}):(\d{2})/); return m? (+m[1])*60 + (+m[2]) : 0; }
function turnoDe(d){
  const min = d.getHours()*60 + d.getMinutes();
  for(const t of CFG.turnos){
    const a=hm(t.ini), b=hm(t.fim);
    if(a<b){ if(min>=a && min<b) return t; }
    else   { if(min>=a || min<b) return t; }     // turno que vira o dia
  }
  return CFG.turnos[0] || {id:'1',nome:'1º turno'};
}
function janelaTurnoAtual(agora=new Date()){
  const t = turnoDe(agora);
  const a=hm(t.ini), b=hm(t.fim), min=agora.getHours()*60+agora.getMinutes();
  const ini = new Date(agora); ini.setSeconds(0,0); ini.setHours(Math.floor(a/60), a%60, 0, 0);
  if(a>=b && min<b) ini.setDate(ini.getDate()-1);          // madrugada do turno que começou ontem
  const fim = new Date(ini); fim.setMinutes(fim.getMinutes() + ((b-a+1440)%1440 || 1440));
  return { turno:t, ini, fim };
}
const PERIODOS = [
  { id:'turno', lbl:'Turno' },
  { id:'hoje',  lbl:'Hoje' },
  { id:'24h',   lbl:'24 h' },
  { id:'7d',    lbl:'7 dias' },
  { id:'tudo',  lbl:'Tudo' },
];
function janela(periodo, agora=new Date()){
  const p = periodo||'hoje';
  if(p==='turno'){ const j=janelaTurnoAtual(agora); return { ini:j.ini, fim:agora, rot:(j.turno.nome||('Turno '+j.turno.id))+' · desde '+hhmm(j.ini) }; }
  if(p==='hoje'){
    const ini=new Date(agora); ini.setHours(Math.floor(hm(CFG.inicioDia)/60), hm(CFG.inicioDia)%60, 0, 0);
    if(ini>agora) ini.setDate(ini.getDate()-1);
    return { ini, fim:agora, rot:'Hoje · desde '+hhmm(ini) };
  }
  if(p==='24h') return { ini:new Date(agora.getTime()-24*3600e3), fim:agora, rot:'Últimas 24 horas' };
  if(p==='7d')  return { ini:new Date(agora.getTime()-7*24*3600e3), fim:agora, rot:'Últimos 7 dias' };
  return { ini:new Date(0), fim:agora, rot:'Base completa' };
}

/* ============================================================
   AGREGAÇÃO — FPY, NOK, motivos, modelos, turnos e tendência
   ============================================================ */
function agregarPosto(key, regs, jan){
  const cfg = CFG.postos[key] || {};
  const lista = regs.filter(r=> r.posto===key && r.ts>=jan.ini && r.ts<=jan.fim);
  const st = {
    key, cfg, total:lista.length,
    testadas:0, ok1:0, nok1:0, fpy:0, retestes:0,
    pecas:0, aprovadas:0, refugo:0, yieldFinal:0,
    motivos:[], modelos:[], turnos:[], hist:[],
    mediaVal:NaN, maxVal:NaN, limite: isFinite(numBR(cfg.limite))? numBR(cfg.limite) : NaN,
    unid: cfg.unid||'cc/min', ultimoNOK:null, ultimoTeste:null,
    cadencia:0, status:'off', atingimento:0,
  };
  if(!lista.length) return st;

  const vistos = new Set(), porPeca = new Map();
  const mMot = new Map(), mMod = new Map(), mTur = new Map();
  let somaVal=0, nVal=0;

  for(const r of lista){
    const idPeca = r.serie || '';
    const primeira = !r.reteste && (!idPeca || !vistos.has(idPeca));
    if(idPeca) vistos.add(idPeca);

    if(primeira){
      st.testadas++;
      if(r.res==='OK') st.ok1++;
      else{
        st.nok1++;
        const mot = r.motivo || 'Não informado';
        mMot.set(mot, (mMot.get(mot)||0)+1);
      }
      const mod = r.modelo || '—';
      const om = mMod.get(mod) || {nome:mod, tot:0, nok:0};
      om.tot++; if(r.res==='NOK') om.nok++; mMod.set(mod, om);

      const tId = r.turno || turnoDe(r.ts).id;
      const ot = mTur.get(tId) || {nome:tId, tot:0, nok:0};
      ot.tot++; if(r.res==='NOK') ot.nok++; mTur.set(tId, ot);
    } else {
      st.retestes++;
      if(r.res==='NOK'){
        const mot = r.motivo || 'Não informado';
        mMot.set(mot, (mMot.get(mot)||0)+1);
      }
    }

    if(idPeca) porPeca.set(idPeca, r.res);
    if(isFinite(r.valor)){ somaVal += r.valor; nVal++; st.maxVal = isFinite(st.maxVal)? Math.max(st.maxVal, r.valor) : r.valor; }
    if(isFinite(r.limite) && !isFinite(st.limite)) st.limite = r.limite;
    if(r.unid) st.unid = r.unid;
    if(r.res==='NOK') st.ultimoNOK = r.ts;
    st.ultimoTeste = r.ts;
  }

  st.fpy = st.testadas? (st.ok1/st.testadas)*100 : 0;
  if(porPeca.size){
    st.pecas = porPeca.size;
    porPeca.forEach(v=>{ if(v==='OK') st.aprovadas++; else st.refugo++; });
  } else {
    st.pecas = st.testadas;
    st.aprovadas = st.ok1 + Math.max(0, lista.filter(r=>r.reteste && r.res==='OK').length);
    st.aprovadas = Math.min(st.aprovadas, st.pecas);
    st.refugo = Math.max(0, st.pecas - st.aprovadas);
  }
  st.yieldFinal = st.pecas? (st.aprovadas/st.pecas)*100 : 0;
  if(nVal){ st.mediaVal = somaVal/nVal; }

  const totNok = st.nok1 || 1;
  st.motivos = [...mMot.entries()].map(([nome,qtd])=>({nome, qtd, pct:(qtd/totNok)*100})).sort((a,b)=>b.qtd-a.qtd);
  st.modelos = [...mMod.values()].map(m=>({...m, fpy: m.tot? ((m.tot-m.nok)/m.tot)*100 : 0})).sort((a,b)=>b.tot-a.tot);
  st.turnos  = [...mTur.values()].map(m=>({...m, fpy: m.tot? ((m.tot-m.nok)/m.tot)*100 : 0})).sort((a,b)=>String(a.nome).localeCompare(String(b.nome)));

  const span = (st.ultimoTeste - lista[0].ts)/3600e3;
  st.cadencia = st.testadas / Math.max(0.25, span || 0.25);

  st.hist = tendencia(lista, jan);

  const meta = numBR(cfg.metaFpy) || 98, min = numBR(cfg.minFpy) || 95, maxNok = numBR(cfg.maxNok);
  st.atingimento = meta? clamp((st.fpy/meta)*100, 0, 100) : 0;
  if(!st.testadas) st.status='off';
  else if(st.fpy < min || (isFinite(maxNok) && st.nok1 > maxNok)) st.status='bad';
  else if(st.fpy < meta) st.status='warn';
  else st.status='ok';
  return st;
}
/* Tendência: FPY por bloco de tempo (12 blocos dentro da janela) */
function tendencia(lista, jan){
  if(!lista.length) return [];
  const N = 12;
  const ini = Math.max(jan.ini.getTime(), lista[0].ts.getTime());
  const fim = Math.max(jan.fim.getTime(), ini+1);
  const passo = (fim-ini)/N;
  const buckets = Array.from({length:N},()=>({tot:0,nok:0}));
  for(const r of lista){
    const i = clamp(Math.floor((r.ts.getTime()-ini)/passo), 0, N-1);
    if(r.reteste) continue;
    buckets[i].tot++; if(r.res==='NOK') buckets[i].nok++;
  }
  return buckets.map(b=>({ tot:b.tot, nok:b.nok, fpy: b.tot? ((b.tot-b.nok)/b.tot)*100 : NaN }));
}
function agregarTudo(regs, periodo){
  const jan = janela(periodo);
  const out = { jan, postos:{}, total:0, nokTotal:0 };
  for(const p of POSTOS){
    const st = agregarPosto(p.key, regs, jan);
    out.postos[p.key] = st;
    out.total += st.testadas; out.nokTotal += st.nok1;
  }
  return out;
}

/* ============================================================
   DADOS DE DEMONSTRAÇÃO (usados quando não há base ligada)
   ============================================================ */
function demoRegistros(){
  const modelos = { USI_BLOCO:['1.0','1.5','1.5 Turbo'], USI_CABECOTE:['1.0','1.5','1.5 Turbo'],
                    MON_ZERO:['1.0','1.5','1.5 Turbo'], MON_WATER:['1.0','1.5','1.5 Turbo'] };
  const perfil = { USI_BLOCO:{fpy:97.6, pph:46, lim:5},  USI_CABECOTE:{fpy:96.4, pph:44, lim:4},
                   MON_ZERO:{fpy:99.1, pph:38, lim:3},   MON_WATER:{fpy:98.2, pph:38, lim:6} };
  const regs=[]; const agora=Date.now(); const dias=7;
  let seq = 1;
  for(const p of POSTOS){
    const pf = perfil[p.key], mots = MOTIVOS_PADRAO[p.key];
    for(let h=dias*24; h>=0; h--){
      const base = agora - h*3600e3;
      const d = new Date(base);
      if(d.getDay()===0) continue;                                  // domingo sem produção
      const hora = d.getHours();
      const carga = (hora>=6 && hora<22)? 1 : 0.55;
      const qtd = Math.round(pf.pph*carga*(0.8+Math.random()*0.4));
      const fpyHora = clamp(pf.fpy + (Math.random()*3-1.6) - (h<6?1.4:0), 88, 100);
      for(let i=0;i<qtd;i++){
        const ts = new Date(base + Math.floor(Math.random()*3600e3));
        const nok = (Math.random()*100) > fpyHora;
        const val = nok? pf.lim*(1.1+Math.random()*1.8) : pf.lim*(0.15+Math.random()*0.6);
        const serie = p.key.slice(0,3)+String(100000+seq++);
        regs.push({
          ts, posto:p.key, res: nok?'NOK':'OK',
          modelo: modelos[p.key][Math.floor(Math.random()*3)],
          serie, valor: +val.toFixed(2), limite: pf.lim, unid:'cc/min',
          motivo: nok? mots[Math.floor(Math.random()*mots.length)] : '',
          turno: turnoDe(ts).id, operador:'', maquina:'', reteste:false,
        });
        if(nok && Math.random()<0.7){                                // reteste após retrabalho
          const ts2 = new Date(ts.getTime()+22*60000);
          regs.push({ ts:ts2, posto:p.key, res: Math.random()<0.85?'OK':'NOK',
            modelo: regs[regs.length-1].modelo, serie, valor:+(pf.lim*0.5).toFixed(2), limite:pf.lim, unid:'cc/min',
            motivo:'', turno:turnoDe(ts2).id, operador:'', maquina:'', reteste:true });
        }
      }
    }
  }
  regs.sort((a,b)=>a.ts-b.ts);
  return regs;
}
function regsParaCSV(regs){
  const cab = ['data_hora','posto','modelo','serie','resultado','vazamento','limite','unidade','motivo','turno','reteste'];
  const fmt = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
                 +' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  const linhas = regs.map(r=>[fmt(r.ts), r.posto, r.modelo, r.serie, r.res,
    isFinite(r.valor)? String(r.valor).replace('.',',') : '',
    isFinite(r.limite)? String(r.limite).replace('.',',') : '',
    r.unid, r.motivo, r.turno, r.reteste?'S':'N'].join(';'));
  return cab.join(';')+'\n'+linhas.join('\n');
}

/* Cache local do último CSV lido (para o painel voltar populado após reboot) */
function salvarCache(texto, fonte, arquivo){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({texto:String(texto).slice(0,4_000_000), fonte, arquivo, em:Date.now()})); }catch(e){}
}
function lerCache(){
  try{ const raw=localStorage.getItem(CACHE_KEY); return raw? JSON.parse(raw) : null; }catch(e){ return null; }
}

function aplicarTexto(texto, fonte, arquivo){
  const {linhas} = parseCSV(texto);
  const {regs, ignorados} = normalizar(linhas);
  if(!regs.length) throw new Error('sem-registros');
  ST.regs = regs; ST.fonte = fonte; ST.arquivo = arquivo||''; ST.ignorados = ignorados;
  ST.atualizadoEm = new Date(); ST.erro='';
  return regs.length;
}

/* ============================================================

function pillDe(st){
  const c = st.cfg||{}, meta = numBR(c.metaFpy)||98, min = numBR(c.minFpy)||95, maxNok = numBR(c.maxNok);
  if(st.status==='off') return {cls:'off', txt:'Sem leitura no período'};
  if(st.status==='bad'){
    if(st.fpy < min) return {cls:'bad', txt:'Crítico — abaixo do mínimo ('+n1(st.fpy)+'%)'};
    return {cls:'bad', txt:'NOK acima do limite ('+nInt(st.nok1)+' / '+nInt(maxNok)+')'};

function sparkHTML(hist, min){

    const cls = h.fpy>=min? '' : (h.fpy>=min-3? 'w':'b');
    return '<i class="'+cls+'" style="height:'+alt.toFixed(0)+'%" title="'+n1(h.fpy)+'% · '+h.tot+' peças"></i>';
  }).join('')+'</div>';
}
function chip(cor, nome, valor, extra){

  } else if(st.testadas){
    motivos = '<div data-sec="motivos"><div class="lbl-s">Motivos de reprovação</div><div class="chips">'
      + chip('#22c55e','Nenhuma reprovação','0','') + '</div></div>';
  }

  const nokAlto = isFinite(maxNok) && st.nok1 > maxNok;
  const boxNok = '<div class="box-nok'+(nokAlto?'':' calmo')+'">'
    + (nokAlto? I.alert : '')
    + '<span class="nm">NOK<br>(1ª passagem)</span>'
    + '<span class="vl">'+nInt(st.nok1)+'<small>máx '+(isFinite(maxNok)? nInt(maxNok):'—')+'</small></span></div>';

  const extras = '<div class="chips linha" data-poda="2">'
    + chip('#38bdf8','Retestes', nInt(st.retestes), st.testadas? Math.round((st.retestes/st.testadas)*100)+'%':'')
    + (st.refugo? chip('#ef4444','Refugo / retido', nInt(st.refugo), n1(st.yieldFinal)+'% final') : '')
    + (isFinite(st.mediaVal)? chip('#a78bfa','Vazamento', n2(st.mediaVal)+' '+esc(st.unid), isFinite(st.limite)? 'lim '+n1(st.limite):'') : '')
    + '</div>';

  let modelos = '';
  if(cfg().mostrarModelos && st.modelos.length && !(st.modelos.length===1 && st.modelos[0].nome==='—')){
    modelos = '<div data-poda="1"><div class="lbl-s">Modelos</div><div class="chips">'
      + st.modelos.slice(0,3).map(m=>{
          const cls = m.fpy>=meta? 'ok' : (m.fpy>=min? 'warn':'bad');
          return '<span class="chip"><i style="background:'+p.cor+'"></i><span class="nm">'+esc(m.nome)+'</span>'
               + '<span class="vl '+cls+'">'+n1(m.fpy)+'%</span><span class="of">'+nInt(m.tot)+' pç · '+nInt(m.nok)+' NOK</span></span>';
        }).join('')
      + '</div></div>';
  }

  const desdeNOK = st.ultimoNOK? Date.now()-st.ultimoNOK.getTime() : NaN;
  const semNOK = isFinite(desdeNOK)
    ? (desdeNOK < 120000 ? 'NOK neste momento' : '≈ '+duracao(desdeNOK)+' sem NOK')
    : 'período sem NOK';
  const rodape = st.testadas
    ? '<b>'+semNOK+'</b>'
      + '<small>cadência '+nInt(st.cadencia)+' pç/h · último teste '+hhmm(st.ultimoTeste)+'</small>'
    : '<b>Aguardando testes</b><small>nenhuma leitura na janela selecionada</small>';

  return '<article class="card st-'+st.status+alarme+'" style="--c:'+p.cor+'" data-posto="'+p.key+'">'
    + '<div class="c-head"><div class="c-ico">'+(I[p.icone]||I.gauge)+'</div>'
      + '<div><h2>'+esc(p.nome)+'</h2><small>'+esc(p.area)+' · leak test</small></div></div>'
    + '<span class="pill '+pill.cls+'"><i></i>'+esc(pill.txt)+'</span>'
    + '<div class="big"><b>'+(st.testadas? n1(st.fpy) : '—')+'</b><span>% FPY</span></div>'
    + '<div class="sub">aprovadas <b>'+nInt(st.ok1)+'</b> · testadas <b>'+nInt(st.testadas)+'</b>'
      + (st.nok1? ' · <span class="nok">'+nInt(st.nok1)+' NOK</span>' : '')+'</div>'
    + '<div class="meta-l"><span class="mt">Meta '+n1(meta)+'%</span><span class="mn">· mín '+n1(min)+'%</span>'
      + '<span class="pc">'+Math.floor(st.atingimento)+'%</span></div>'
    + '<div class="bar"><i style="width:'+st.atingimento.toFixed(1)+'%"></i></div>'
    + '<div data-poda="4">'+sparkHTML(st.hist, min)+'</div>'
    + motivos + boxNok + extras + modelos
    + '<div class="c-foot">'+I.hour+'<div>'+rodape+'</div></div>'
    + '</article>';
}

function render(){
  const c = cfg();
  const ag = agregarTudo(ST.regs, c.periodo);
  ST.agregado = ag;

  const ativos = POSTOS.filter(p=> (c.postos[p.key]||{}).ativo!==false );
  const cards = $('#cards');
  cards.className = 'cards' + (ativos.length<=2? ' c2' : ativos.length>=5? ' c4' : '');
  cards.innerHTML = ativos.map(p=> cardHTML(p, ag.postos[p.key])).join('')
    || '<div class="hist-vazio" style="place-self:center">Nenhum posto habilitado — abra as metas para ativar.</div>';
  $$('#cards .card').forEach(el=> el.onclick = ()=> modalDetalhes(el.dataset.posto));
  ajustarCards();

  // alarme só na transição para crítico
  ativos.forEach(p=>{
    const st = ag.postos[p.key], ant = ST.alarmes[p.key];
    if(st.status==='bad' && ant!=='bad') Som.bipe(3);
    ST.alarmes[p.key] = st.status;
  });

  pintarStatus();
  desenharBotoes();
  desenharPeriodos();
}

/* Painel de TV: se o card nao couber na altura da tela, corta primeiro o que
   e complementar (modelos, chips extras, motivos alem dos dois maiores, tendencia). */
function ajustarCards(){
  $$('#cards .card').forEach(card=>{
    let guarda = 0;
    const cabe = ()=> card.scrollHeight <= card.clientHeight + 2;
    while(!cabe() && guarda++ < 40){
      const alvo = card.querySelector('[data-poda="1"]') || card.querySelector('[data-poda="2"]');
      if(alvo){ alvo.remove(); continue; }
      const chips = $$('[data-sec="motivos"] .chip', card);
      if(chips.length > 2){ chips[chips.length-1].remove(); continue; }
      const sp = card.querySelector('[data-poda="4"]');
      if(sp){ sp.remove(); continue; }
      break;
    }
  });
}

function desenharPeriodos(){

function telaCheia(){
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});

function lerArquivo(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const n = aplicarTexto(r.result, 'arquivo', file.name);
      salvarCache(r.result, 'arquivo', file.name);
      fecharModal(); render(); toast(nInt(n)+' registros carregados de '+file.name);
    }catch(e){ toast('Não foi possível ler esse arquivo — confira as colunas','err'); }
  };
  r.onerror = ()=> toast('Falha ao abrir o arquivo','err');
  r.readAsText(file, 'utf-8');
}

    botoes:'<button class="btn ghost" data-exp="1">'+I.download+'Exportar registros (CSV)</button>'
      + '<button class="btn ghost" data-res="1">'+I.download+'Exportar resumo (CSV)</button>'
      + '<button class="btn primary" data-c="1">Fechar</button>' });
  $('[data-c]').onclick = fecharModal;

  function lista(){
    return ST.regs.filter(r=> r.ts>=jan.ini && r.ts<=jan.fim && (!filtro || r.posto===filtro));
  }
  function pinta(){
    const l = lista();
    const ag = ST.agregado;
    const alvos = filtro? [POSTO_BY[filtro]] : POSTOS;
    $('#resumo').innerHTML = '<div class="chips" style="flex-direction:row;flex-wrap:wrap;gap:6px">'
      + alvos.map(p=>{ const s = ag.postos[p.key];
          const cls = s.status==='ok'?'ok':s.status==='warn'?'warn':s.status==='bad'?'bad':'';
          return '<span class="chip"><i style="background:'+p.cor+'"></i><span class="nm">'+esc(p.nome)+'</span>'
            + '<span class="vl '+cls+'">'+n1(s.fpy)+'%</span><span class="of">'+nInt(s.testadas)+' testes · '+nInt(s.nok1)+' NOK · '
            + nInt(s.retestes)+' reteste'+(s.retestes===1?'':'s')+'</span></span>';
        }).join('') + '</div>';
    const ult = l.slice(-400).reverse();
    $('#tbody').innerHTML = ult.map(r=>'<tr>'
      + '<td>'+dtBR(r.ts)+'</td>'
      + '<td>'+esc((POSTO_BY[r.posto]||{}).nome||r.posto)+'</td>'
      + '<td>'+esc(r.modelo||'—')+'</td>'
      + '<td>'+esc(r.serie||'—')+'</td>'
      + '<td><span class="tag '+(r.res==='NOK'?'nok':'ok')+'">'+r.res+'</span></td>'
      + '<td>'+(isFinite(r.valor)? n2(r.valor)+' '+esc(r.unid||'') : '—')+'</td>'
      + '<td>'+(isFinite(r.limite)? n2(r.limite) : '—')+'</td>'
      + '<td>'+esc(r.motivo||'—')+'</td>'
      + '<td>'+esc(r.turno||'—')+'</td>'
      + '<td>'+(r.reteste? 'reteste':'1ª')+'</td>'
      + '</tr>').join('') || '<tr><td colspan="10" style="color:var(--muted)">Nenhum registro no período.</td></tr>';
  }
  $$('#fPost button').forEach(b=> b.onclick = ()=>{
    filtro = b.dataset.p; $$('#fPost button').forEach(x=>x.classList.toggle('on', x===b)); pinta();
  });
  $('[data-exp]').onclick = ()=> download('leak-registros.csv', regsParaCSV(lista()));
  $('[data-res]').onclick = ()=>{
    const ag = ST.agregado;
    const cab = 'posto;periodo;testadas;aprovadas_1a;nok_1a;fpy_%;retestes;pecas;refugo;yield_final_%;meta_%;minimo_%;max_nok;vazamento_medio;limite;unidade;principal_motivo';
    const linhas = POSTOS.map(p=>{ const s = ag.postos[p.key], k = s.cfg||{};
      return [p.nome, ag.jan.rot, s.testadas, s.ok1, s.nok1, n1(s.fpy), s.retestes, s.pecas, s.refugo, n1(s.yieldFinal),
        k.metaFpy, k.minFpy, k.maxNok, isFinite(s.mediaVal)? n2(s.mediaVal):'', isFinite(s.limite)? n1(s.limite):'', s.unid,
        (s.motivos[0]? s.motivos[0].nome+' ('+s.motivos[0].qtd+')' : '')].join(';'); });
    download('leak-resumo.csv', cab+'\n'+linhas.join('\n'));
  };
  pinta();
}

/* ============================================================
   TEMA, RELÓGIO E CICLO DE ATUALIZAÇÃO
   ============================================================ */
function aplicarTema(){
  const c = cfg();
  document.documentElement.dataset.theme = c.tema==='light'? 'light':'dark';
  if(c.escala && c.escala!=='auto') document.documentElement.dataset.esc = c.escala;
  else delete document.documentElement.dataset.esc;
}
function relogio(){
  const d = new Date();
  $('#relogio').textContent = hhmm(d);
  $('#dataHoje').textContent = d.toLocaleDateString('pt-BR',{weekday:'short', day:'2-digit', month:'2-digit', year:'numeric'})
    .replace('.','').replace(/^(\w)/, m=>m.toUpperCase());
}
function tique(){
  relogio();
  if(!ST.carregando){
    ST.proximaEm = Math.max(0, ST.proximaEm-1);
    if(ST.proximaEm===0) carregar(false);
  }
  const el = $('#pfNext');
  if(el){ const mm=Math.floor(ST.proximaEm/60), ss=ST.proximaEm%60;
    el.innerHTML = I.refresh+' Próxima em: <b>'+(ST.carregando?'lendo…':String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0'))+'</b>'; }
}

/* ---------- Atalhos de teclado ---------- */
document.addEventListener('keydown', e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if(k==='escape') return fecharModal();
  if(k==='r'){ Som.liberar(); carregar(true); }
  else if(k==='f') telaCheia();
  else if(k==='m'){ const c=cfg(); c.alarme=!c.alarme; cfgSalvar(); atualizarBotoes(); toast('Alarme '+(c.alarme?'ligado':'desligado'),'info'); }
  else if(k==='c') modalConfig();
  else if(k==='t') modalMetas();
  else if(k==='d') modalDetalhes('');
  else if(/^[1-5]$/.test(k)){ const p = PERIODOS[+k-1]; if(p){ cfg().periodo=p.id; cfgSalvar(); render(); } }
});
document.addEventListener('fullscreenchange', atualizarBotoes);
document.addEventListener('click', ()=> Som.liberar(), {once:true});

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
(async function iniciar(){
  $('#phLogo').innerHTML = I.drop;
  cfgCarregarLocal();
  aplicarTema();
  relogio(); setInterval(tique, 1000);

  await Backend.init();
  if(Backend.modo==='servidor'){
    const remota = await Backend.lerCfg();
    if(remota) setCfg(mescla(cfg(), remota));
    aplicarTema();
  }
  reiniciarContagem();
  await carregar(false);

  // Recarrega ao voltar para a aba se a leitura estiver vencida
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden && ST.atualizadoEm && (Date.now()-ST.atualizadoEm.getTime()) > (numBR(cfg().intervalo)||5)*60000) carregar(false);
  });
})();
})();
</script>
