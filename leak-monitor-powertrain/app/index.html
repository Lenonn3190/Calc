<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Leak Test | Powertrain — Monitor de Estanqueidade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2300b4e6'/%3E%3Cpath d='M50 18 C34 40 26 52 26 62 a24 24 0 0 0 48 0 c0-10-8-22-24-44z' fill='white'/%3E%3C/svg%3E" />
<meta name="theme-color" content="#05080d" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Leak Test" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />

<style>
/* ============ BASE — painel andon / SCADA ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05080d; --pan:#0d1219; --pan2:#121923; --pan3:#161b22; --line:#1e2833;
  --txt:#f2f6fb; --mut:#8b9bb0; --faint:#5d6d82;
  --ok:#16c060; --warn:#f0a500; --bad:#e5322d; --brand:#00b4e6;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --esc:1;                      /* escala do painel (configurável) */
}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;line-height:1.35;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:14px}
svg{width:18px;height:18px;flex:none}
.tela{height:100vh;display:flex;flex-direction:column}

/* ============ CABEÇALHO DO TÍTULO (único elemento de topo) ============ */
.topo{display:flex;align-items:center;gap:calc(22px * var(--esc));background:#080c12;
  padding:calc(clamp(12px,1.05vw,20px) * var(--esc)) calc(clamp(16px,1.8vw,34px) * var(--esc));
  border-bottom:3px solid var(--brand)}
.marca{width:calc(clamp(38px,3.1vw,60px) * var(--esc));height:calc(clamp(38px,3.1vw,60px) * var(--esc));
  flex:none;display:grid;place-items:center;background:var(--brand)}
.marca svg{width:56%;height:56%;color:#04121f}
.topo h1{font-size:calc(clamp(22px,2.4vw,46px) * var(--esc));font-weight:800;letter-spacing:.5px;
  line-height:1;text-transform:uppercase;white-space:nowrap}
.topo h1 b{color:var(--brand);font-weight:800}
.topo p{color:var(--mut);font-size:calc(clamp(10px,.85vw,16px) * var(--esc));font-weight:600;
  letter-spacing:2.6px;text-transform:uppercase;margin-top:7px}
.topo .sp{flex:1}
/* aviso só aparece quando a base falha, está velha ou é demonstração */
.alerta{display:none;align-items:center;gap:10px;padding:calc(9px * var(--esc)) calc(16px * var(--esc));
  font-size:calc(clamp(12px,.95vw,18px) * var(--esc));font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
  white-space:nowrap}
.alerta.ver{display:flex}
.alerta.err{background:var(--bad);color:#fff}
.alerta.aviso{background:var(--warn);color:#1d1400}
.alerta svg{width:1.2em;height:1.2em}

/* ============ COLUNAS ============ */
.grade{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  background:var(--line);border-top:4px solid var(--line)}
.grade.c1{grid-template-columns:1fr}
.grade.c2{grid-template-columns:repeat(2,1fr)}
.grade.c3{grid-template-columns:repeat(3,1fr)}
.grade.c5{grid-template-columns:repeat(5,1fr)}
.col{background:var(--pan);display:flex;flex-direction:column;min-width:0;overflow:hidden;cursor:pointer}
.col>*{flex-shrink:0}

.faixa{padding:calc(clamp(10px,.85vw,16px) * var(--esc)) calc(clamp(12px,1.15vw,22px) * var(--esc)) calc(clamp(9px,.75vw,14px) * var(--esc));
  display:flex;align-items:baseline;gap:calc(14px * var(--esc));background:var(--faint)}
.faixa h2{font-size:calc(clamp(20px,2.1vw,40px) * var(--esc));font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;line-height:1;color:#06090d;white-space:nowrap;flex:0 0 auto}
.faixa span{font-size:calc(clamp(9px,.8vw,15px) * var(--esc));font-weight:800;letter-spacing:2.4px;
  text-transform:uppercase;color:rgba(6,9,13,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.col.st-ok   .faixa{background:var(--ok)}
.col.st-warn .faixa{background:var(--warn)}
.col.st-bad  .faixa{background:var(--bad)}
.col.st-bad  .faixa h2{color:#fff}
.col.st-bad  .faixa span{color:rgba(255,255,255,.78)}
.col.alarme .faixa{animation:pisca 1.1s steps(1,end) infinite}
@keyframes pisca{0%,72%{background:var(--bad)} 73%,100%{background:#6f120f}}

.corpo{flex:1;min-height:0;display:flex;flex-direction:column;
  padding:calc(clamp(14px,1.35vw,26px) * var(--esc)) calc(clamp(12px,1.15vw,22px) * var(--esc)) 0}

.estado{font-size:calc(clamp(13px,1.25vw,24px) * var(--esc));font-weight:800;letter-spacing:2.5px;
  text-transform:uppercase;height:calc(clamp(20px,1.8vw,34px) * var(--esc));white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.col.st-ok .estado{color:var(--ok)} .col.st-warn .estado{color:var(--warn)}
.col.st-bad .estado{color:var(--bad)} .col.st-off .estado{color:var(--faint)}

.fpy{display:flex;align-items:baseline;gap:calc(12px * var(--esc));white-space:nowrap;
  height:calc(clamp(64px,6.9vw,132px) * var(--esc))}
.fpy b{font-size:calc(clamp(66px,7.3vw,140px) * var(--esc));font-weight:800;line-height:.82;
  letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.fpy i{font-style:normal;font-size:calc(clamp(15px,1.5vw,29px) * var(--esc));font-weight:800;
  color:var(--mut);letter-spacing:1px}

.meta{height:calc(clamp(44px,3.85vw,74px) * var(--esc))}
.meta .lin{display:flex;justify-content:space-between;gap:10px;
  font-size:calc(clamp(10px,.9vw,17px) * var(--esc));font-weight:700;color:var(--mut);
  letter-spacing:1.4px;text-transform:uppercase;margin-bottom:calc(9px * var(--esc));white-space:nowrap}
.meta .lin b{color:var(--txt);font-variant-numeric:tabular-nums}
.prog{height:calc(clamp(9px,.83vw,16px) * var(--esc));background:#1a2330}
.prog i{display:block;height:100%;background:var(--faint)}
.col.st-ok .prog i{background:var(--ok)} .col.st-warn .prog i{background:var(--warn)}
.col.st-bad .prog i{background:var(--bad)}

.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line);
  height:calc(clamp(66px,5.83vw,112px) * var(--esc))}
.nums div{background:var(--pan2);padding:calc(clamp(9px,.78vw,15px) * var(--esc)) 6px;text-align:center;
  display:flex;flex-direction:column;justify-content:center;min-width:0}
.nums span{display:block;font-size:calc(clamp(8.5px,.73vw,14px) * var(--esc));font-weight:800;letter-spacing:2px;
  color:var(--faint);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums b{display:block;font-size:calc(clamp(28px,2.7vw,52px) * var(--esc));font-weight:800;line-height:1.05;
  font-variant-numeric:tabular-nums;margin-top:4px}
.nums .r b{color:var(--bad)}
.nums .r.zero b{color:var(--txt)}

.falha{margin-top:calc(clamp(13px,1.25vw,24px) * var(--esc));height:calc(clamp(52px,4.4vw,84px) * var(--esc));
  border-left:calc(6px * var(--esc)) solid var(--bad);background:var(--pan3);
  padding:calc(clamp(8px,.73vw,14px) * var(--esc)) calc(clamp(10px,.83vw,16px) * var(--esc));
  display:flex;flex-direction:column;justify-content:center;min-width:0}
.falha.vazio{border-left-color:var(--ok)}
.falha span{display:block;font-size:calc(clamp(8.5px,.73vw,14px) * var(--esc));font-weight:800;letter-spacing:2px;
  color:var(--faint);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.falha b{display:block;font-size:calc(clamp(15px,1.4vw,27px) * var(--esc));font-weight:800;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.falha b i{font-style:normal;color:var(--bad)}

.sec{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line);
  margin-top:calc(clamp(12px,1.15vw,22px) * var(--esc));height:calc(clamp(54px,4.6vw,88px) * var(--esc))}
.sec div{background:var(--pan2);padding:calc(clamp(8px,.68vw,13px) * var(--esc)) calc(clamp(9px,.73vw,14px) * var(--esc));
  display:flex;flex-direction:column;justify-content:center;min-width:0}
.sec span{display:block;font-size:calc(clamp(8px,.68vw,13px) * var(--esc));font-weight:800;letter-spacing:1.6px;
  color:var(--faint);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec b{display:block;font-size:calc(clamp(19px,1.77vw,34px) * var(--esc));font-weight:800;line-height:1.1;
  margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sec b em{font-style:normal;font-size:.55em;color:var(--mut);letter-spacing:.5px}

.hist{margin-top:auto;padding:calc(clamp(12px,1.15vw,22px) * var(--esc)) 0 calc(clamp(10px,.94vw,18px) * var(--esc))}
.hist .lb{font-size:calc(clamp(8px,.68vw,13px) * var(--esc));font-weight:800;letter-spacing:2px;
  color:var(--faint);text-transform:uppercase;margin-bottom:calc(9px * var(--esc));white-space:nowrap}
.pontos{display:grid;grid-template-columns:repeat(10,1fr);gap:calc(4px * var(--esc))}
.pontos i{display:block;height:calc(clamp(18px,2vw,38px) * var(--esc));background:var(--ok)}
.pontos i.n{background:var(--bad)}
.pontos i.v{background:#1a2330}

.rodape{display:flex;justify-content:space-between;gap:10px;background:#080c12;border-top:2px solid var(--line);
  padding:calc(clamp(9px,.83vw,16px) * var(--esc)) calc(clamp(12px,1.15vw,22px) * var(--esc));
  height:calc(clamp(38px,3.13vw,60px) * var(--esc));align-items:center;
  font-size:calc(clamp(11px,.94vw,18px) * var(--esc));font-weight:800;letter-spacing:.6px;
  text-transform:uppercase;white-space:nowrap;color:var(--faint)}
.rodape b{color:var(--txt);font-variant-numeric:tabular-nums}
.col.st-bad .rodape b{color:var(--bad)}

/* ============ BARRA DE CONTROLE (aparece com o mouse/toque) ============ */
.barra{position:fixed;left:50%;bottom:22px;transform:translate(-50%,26px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;z-index:50;
  padding:10px 14px;background:#0a0f16;border:2px solid var(--line);
  box-shadow:0 20px 48px -18px #000;transition:opacity .18s, transform .18s}
.barra.ver{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.seg{display:flex;gap:2px;background:var(--line);border:1px solid var(--line)}
.seg button{padding:7px 14px;font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--mut);background:var(--pan2);transition:.12s;white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--brand);color:#04121f}
.info{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--mut);
  letter-spacing:.6px;white-space:nowrap;cursor:pointer}
.info b{color:var(--txt);font-variant-numeric:tabular-nums}
.info .dot{width:9px;height:9px;background:var(--ok);flex:none}
.info .dot.off{background:var(--faint)} .info .dot.err{background:var(--bad)}
.btns{display:flex;gap:6px}
.ib{width:38px;height:38px;display:grid;place-items:center;color:var(--mut);background:var(--pan2);
  border:1px solid var(--line);transition:.12s}
.ib:hover{color:var(--txt);border-color:var(--faint)}
.ib.on{color:#04121f;background:var(--brand);border-color:var(--brand)}
.ib.off{color:var(--faint)}
.ib svg{width:17px;height:17px}
.ib.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ MODAIS ============ */
.ov{position:fixed;inset:0;background:rgba(2,5,9,.82);z-index:60;display:flex;align-items:flex-start;
  justify-content:center;padding:20px;overflow:auto;animation:fade .16s}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:880px;background:var(--pan);border:2px solid var(--line);margin:auto;animation:up .18s}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:2px solid var(--line);
  position:sticky;top:0;background:var(--pan);z-index:2}
.modal-head h3{font-size:16px;font-weight:800;flex:1;text-transform:uppercase;letter-spacing:1px}
.modal-head svg{color:var(--brand)}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:2px solid var(--line);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;font-weight:800;font-size:13px;
  letter-spacing:.6px;text-transform:uppercase;border:1px solid var(--line);background:var(--pan2);
  color:var(--txt);transition:.12s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--brand);color:#04121f;border-color:var(--brand)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.field input,.field select{padding:10px 11px;border:1px solid var(--line);background:var(--pan2);
  color:var(--txt);outline:none;width:100%}
.field input:focus,.field select:focus{border-color:var(--brand)}
.field .hint{font-size:11px;color:var(--faint);font-weight:600}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.sw{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--pan2);border:1px solid var(--line);cursor:pointer}
.sw input{width:17px;height:17px;accent-color:var(--brand);cursor:pointer;flex:none}
.sw span{font-size:13px;font-weight:700}
.sw small{display:block;color:var(--faint);font-size:11px;font-weight:600}
.mgrp{border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.mgrp>h4{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:1px}
.mgrp>h4 i{width:12px;height:12px;flex:none}
.tbl-wrap{overflow:auto;max-height:52vh;border:1px solid var(--line)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px}
table.tbl th{position:sticky;top:0;background:var(--pan2);color:var(--mut);text-align:left;padding:9px 12px;
  font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:1px;z-index:1}
table.tbl td{padding:8px 12px;border-top:1px solid var(--line);white-space:nowrap}
table.tbl tbody tr:hover{background:var(--pan2)}
td .tag{padding:2px 9px;font-size:11px;font-weight:800}
td .tag.ok{background:rgba(22,192,96,.16);color:var(--ok)}
td .tag.nok{background:rgba(229,50,45,.16);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--pan2);border:1px solid var(--line);
  font-size:13px;font-weight:700;min-width:0}
.chip i{width:10px;height:10px;flex:none}
.chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip .vl{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .vl.ok{color:var(--ok)}.chip .vl.warn{color:var(--warn)}.chip .vl.bad{color:var(--bad)}
.chip .of{color:var(--faint);font-weight:700;white-space:nowrap}
.drop{border:2px dashed var(--line);padding:26px;text-align:center;color:var(--mut);font-weight:700;
  font-size:13px;cursor:pointer;transition:.12s}
.drop:hover,.drop.over{border-color:var(--brand);color:var(--brand)}
.drop svg{width:26px;height:26px;margin-bottom:8px;color:var(--faint)}
code.k{background:var(--pan2);border:1px solid var(--line);padding:1px 6px;font-size:11.5px;color:var(--brand)}
.aviso{display:flex;gap:10px;padding:12px 14px;font-size:12.5px;font-weight:600;
  background:rgba(240,165,0,.12);border:1px solid var(--warn);color:var(--txt)}
.aviso svg{color:var(--warn);flex:none}

/* ============ TOASTS ============ */
#toasts{position:fixed;right:16px;top:16px;display:flex;flex-direction:column;gap:9px;z-index:90}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--pan2);
  border-left:5px solid var(--brand);box-shadow:0 16px 34px -16px #000;
  font-size:13px;font-weight:700;max-width:min(90vw,400px);animation:up .18s}
.toast svg{width:17px;height:17px}
.toast.ok{border-left-color:var(--ok)} .toast.ok svg{color:var(--ok)}
.toast.err{border-left-color:var(--bad)} .toast.err svg{color:var(--bad)}
.toast.info svg{color:var(--brand)}

/* ============ RESPONSIVO / TV ============ */
:root[data-esc="p"]{--esc:.85} :root[data-esc="m"]{--esc:1}
:root[data-esc="g"]{--esc:1.12} :root[data-esc="gg"]{--esc:1.26}
@media (max-width:1100px){ .grade{grid-template-columns:repeat(2,1fr)!important} }
@media (max-width:720px){
  body{overflow:auto}
  .tela{height:auto;min-height:100vh}
  .grade{grid-template-columns:1fr!important}
  .topo{flex-wrap:wrap;gap:12px}
  .topo h1{white-space:normal;font-size:24px}
  .topo p{letter-spacing:1.4px}
  .barra{left:8px;right:8px;bottom:8px;transform:none;opacity:1;pointer-events:auto;overflow:hidden}
  .barra.ver{transform:none}
  .info{white-space:normal;text-align:center}
  .modal-foot{flex-direction:column-reverse}
  .modal-foot .btn{justify-content:center}
}
</style>
</head>
<body>

<div class="tela">
  <header class="topo">
    <div class="marca" id="marca"></div>
    <div>
      <h1>Leak Test <b>| Powertrain</b></h1>
      <p>Usinagem · Bloco e Cabeçote &nbsp;·&nbsp; Montagem de Motores · Leak Zero e Water Leak</p>
    </div>
    <div class="sp"></div>
    <div class="alerta" id="alerta"></div>
  </header>

  <main class="grade" id="grade"></main>
</div>

<div class="barra" id="barra">
  <div class="seg" id="segPeriodo"></div>
  <span class="info" id="infoBase"></span>
  <div class="btns" id="phBtns"></div>
</div>

<div id="modal-root"></div>
<div id="toasts"></div>

<script>/* ============================================================
   Leak Test | Powertrain — Monitor de Estanqueidade
   Núcleo: configuração, leitura da base (CSV), normalização e
   agregação dos resultados (FPY, NOK, motivos, modelos, turnos).
   App single-file, funciona offline; base compartilhada opcional.
   ============================================================ */
(function(){
"use strict";

/* ---------- Ícones (Lucide-style) ---------- */
const I = {
  drop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7c3.2 4.4 6 7.9 6 11a6 6 0 0 1-12 0c0-3.1 2.8-6.6 6-11z"/></svg>',

/* ---------- Utils ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
const semAcento = s => String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const nInt = n => (isFinite(n)?Math.round(n):0).toLocaleString('pt-BR');
const n1 = n => (isFinite(n)?n:0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const n2 = n => (isFinite(n)?n:0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const hhmm = d => d? d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '—';
const dtBR = d => d? d.toLocaleDateString('pt-BR')+' '+hhmm(d) : '—';

function numBR(v){
  if(v==null) return NaN;
  if(typeof v==='number') return v;
  let s=String(v).trim().replace(/\s|[a-zA-Z%/]+$/g,'');
  if(!s) return NaN;
  if(s.includes(',')&&s.includes('.')) s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if(s.includes(',')) s = s.replace(',','.');
  const n = parseFloat(s);
  return isFinite(n)? n : NaN;
}
function duracao(ms){
  if(!isFinite(ms)||ms<0) return '—';
  const min = ms/60000;
  if(min<1) return 'agora';
  if(min<60) return Math.round(min)+' min';
  const h = min/60;
  if(h<48) return n1(h).replace(/,0$/,'')+' h';
  return Math.round(h/24)+' dias';
}
function download(nome, txt, tipo='text/csv;charset=utf-8'){
  const blob = txt instanceof Blob ? txt : new Blob(['﻿'+txt],{type:tipo});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),400);
}
function toast(msg, kind='ok'){
  const ic = kind==='err'?I.alert : kind==='info'?I.db : I.check;
  const t = document.createElement('div'); t.className='toast '+kind;
  t.innerHTML = ic+'<span>'+esc(msg)+'</span>';
  $('#toasts').appendChild(t);
  setTimeout(()=>{ t.style.transition='.3s'; t.style.opacity='0'; t.style.transform='translateX(20px)'; setTimeout(()=>t.remove(),300); },4000);
}

function mescla(base, novo){
  if(!novo || typeof novo!=='object') return base;
  const out = {...base};
  for(const k of Object.keys(novo)){
    if(novo[k]==null) continue;
    if(k==='postos'){
      out.postos = {...base.postos};
      for(const p of Object.keys(novo.postos||{})) out.postos[p] = {...(base.postos[p]||{}), ...novo.postos[p]};
    } else if(k==='turnos' && Array.isArray(novo.turnos) && novo.turnos.length){
      out.turnos = novo.turnos;
    } else if(typeof novo[k]!=='object'){
      out[k] = novo[k];
    }
  }
  return out;
}

   ============================================================ */
function detectarSep(linha){
  const cands = [';','\t','|',','];
  let melhor=';', max=-1;
  for(const c of cands){
    let n=0, dentro=false;
    for(let i=0;i<linha.length;i++){
      const ch=linha[i];
      if(ch==='"') dentro=!dentro;
      else if(ch===c && !dentro) n++;
    }
    if(n>max){ max=n; melhor=c; }
  }
  return max>0? melhor : ';';
}
function parseCSV(texto){
  let t = String(texto||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n').trim();
  if(!t) return { cols:[], linhas:[] };
  const sep = detectarSep(t.split('\n')[0]);
  const linhas=[]; let campo='', linha=[], dentro=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(dentro){
      if(ch==='"'){ if(t[i+1]==='"'){ campo+='"'; i++; } else dentro=false; }
      else campo+=ch;
    } else {
      if(ch==='"') dentro=true;
      else if(ch===sep){ linha.push(campo); campo=''; }
      else if(ch==='\n'){ linha.push(campo); linhas.push(linha); linha=[]; campo=''; }
      else campo+=ch;
    }
  }
  linha.push(campo); linhas.push(linha);
  const cab = (linhas.shift()||[]).map(c=>c.trim());
  const cols = cab.map(semAcento);
  const out = [];
  for(const l of linhas){
    if(!l.length || l.every(c=>!String(c).trim())) continue;
    const o = {};
    cols.forEach((c,i)=>{ if(c) o[c] = (l[i]==null?'':String(l[i]).trim()); });
    o.__orig = cab;
    out.push(o);
  }
  return { cols, linhas:out, sep };
}

function parseData(v){
  if(!v) return null;
  const s = String(v).trim();
  if(/^\d{13}$/.test(s)) return new Date(+s);
  if(/^\d{10}$/.test(s)) return new Date(+s*1000);
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0));
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    let ano = +m[3]; if(ano<100) ano += ano<70? 2000 : 1900;
    return new Date(ano, +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0), +(m[6]||0));
  }
  m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  if(m){ const d=new Date(); d.setHours(+m[1], +m[2], +(m[3]||0), 0); return d; }
  const d = new Date(s);
  return isNaN(d)? null : d;
}
function normPosto(txt){
  const s = semAcento(txt);
  if(!s) return '';
  if(POSTO_BY[String(txt).trim().toUpperCase()]) return String(txt).trim().toUpperCase();
  if(/water|agua|arrefec|refrig|d'?agua/.test(s)) return 'MON_WATER';
  if(/leak\s*zero|zero\s*leak|leakzero|estanqueidade\s*zero|\bzero\b/.test(s)) return 'MON_ZERO';
  if(/cabecote|cabeca|head|tampa\s*de\s*cilindro/.test(s)) return 'USI_CABECOTE';
  if(/bloco|block|monobloco|carcaca/.test(s)) return 'USI_BLOCO';
  return '';
}
function normRes(txt){
  const s = semAcento(txt);
  if(!s) return '';
  if(/^(ok|pass|passa|aprov|approved|bom|conforme|good|a|p|1|sim|s|g)$/.test(s)) return 'OK';
  if(/^(nok|ng|n\.?ok|fail|falha|reprov|rejeit|ruim|nc|nao conforme|r|f|0|nao|n|refugo)$/.test(s)) return 'NOK';
  if(/nok|ng|fail|reprov|rejeit|refug|nao conforme|vazando|vazamento alto/.test(s)) return 'NOK';
  if(/ok|pass|aprov|conforme/.test(s)) return 'OK';
  return '';
}
/* Coluna de contagem (tentativa/ciclo/passagem) só é reteste a partir da 2ª;
   coluna booleana (reteste/retrabalho) aceita S/Sim/1/X. */
function ehReteste(campo){
  if(!campo.val) return false;
  if(/tentativa|ciclo|passagem|repeticao/.test(campo.col)){ const n = numBR(campo.val); return isFinite(n)? n>1 : ehVerdade(campo.val); }
  return ehVerdade(campo.val);
}
function ehVerdade(txt){
  const s = semAcento(txt);
  if(!s) return false;
  if(/^(s|sim|y|yes|true|verdadeiro|x|1)$/.test(s)) return true;
  const n = numBR(s);
  return isFinite(n) && n>1;   // tentativa/ciclo 2, 3… = reteste
}

/* Converte as linhas cruas em registros normalizados */
function normalizar(linhas){
  const regs=[]; let ignorados=0, semData=0;
  for(const l of linhas){
    const posto = normPosto(pega(l,'posto')) || normPosto(pega(l,'peca')) || normPosto(pega(l,'maquina')) || normPosto(pega(l,'linha'));
    if(!posto){ ignorados++; continue; }
    const ts = parseData(pega(l,'data'));
    if(!ts) semData++;
    let res = normRes(pega(l,'res'));
    const valor = numBR(pega(l,'valor'));
    const limite = numBR(pega(l,'limite'));
    if(!res && isFinite(valor) && isFinite(limite)) res = valor>limite? 'NOK':'OK';   // deduz pelo valor medido
    if(!res) res = 'OK';
    const motivo = String(pega(l,'motivo')||'').trim();
    regs.push({
      ts, posto, res,
      modelo: String(pega(l,'modelo')||'').trim(),
      serie: String(pega(l,'serie')||'').trim(),
      valor: isFinite(valor)? valor : NaN,
      limite: isFinite(limite)? limite : NaN,
      unid: String(pega(l,'unid')||'').trim(),
      motivo: res==='NOK'? (motivo||'Não informado') : motivo,
      turno: String(pega(l,'turno')||'').trim(),
      operador: String(pega(l,'operador')||'').trim(),
      maquina: String(pega(l,'maquina')||'').trim(),
      reteste: ehReteste(pegaCampo(l,'reteste')),
    });
  }
  // Sem data em nenhuma linha: distribui no tempo para não esconder tudo nos filtros
  if(semData){
    const base = Date.now() - regs.length*30000;
    regs.forEach((r,i)=>{ if(!r.ts) r.ts = new Date(base + i*30000); });
  }
  regs.sort((a,b)=> a.ts - b.ts);
  return { regs, ignorados, semData };
}

/* ============================================================
   PERÍODOS E TURNOS
   ============================================================ */
function hm(str){ const m=String(str||'').match(/^(\d{1,2}):(\d{2})/); return m? (+m[1])*60 + (+m[2]) : 0; }
function turnoDe(d){
  const min = d.getHours()*60 + d.getMinutes();
  for(const t of CFG.turnos){
    const a=hm(t.ini), b=hm(t.fim);
    if(a<b){ if(min>=a && min<b) return t; }
    else   { if(min>=a || min<b) return t; }     // turno que vira o dia
  }
  return CFG.turnos[0] || {id:'1',nome:'1º turno'};
}
function janelaTurnoAtual(agora=new Date()){
  const t = turnoDe(agora);
  const a=hm(t.ini), b=hm(t.fim), min=agora.getHours()*60+agora.getMinutes();
  const ini = new Date(agora); ini.setSeconds(0,0); ini.setHours(Math.floor(a/60), a%60, 0, 0);
  if(a>=b && min<b) ini.setDate(ini.getDate()-1);          // madrugada do turno que começou ontem
  const fim = new Date(ini); fim.setMinutes(fim.getMinutes() + ((b-a+1440)%1440 || 1440));
  return { turno:t, ini, fim };
}
const PERIODOS = [
  { id:'turno', lbl:'Turno' },
  { id:'hoje',  lbl:'Hoje' },
  { id:'24h',   lbl:'24 h' },
  { id:'7d',    lbl:'7 dias' },
  { id:'tudo',  lbl:'Tudo' },
];
function janela(periodo, agora=new Date()){
  const p = periodo||'hoje';
  if(p==='turno'){ const j=janelaTurnoAtual(agora); return { ini:j.ini, fim:agora, rot:(j.turno.nome||('Turno '+j.turno.id))+' · desde '+hhmm(j.ini) }; }
  if(p==='hoje'){
    const ini=new Date(agora); ini.setHours(Math.floor(hm(CFG.inicioDia)/60), hm(CFG.inicioDia)%60, 0, 0);
    if(ini>agora) ini.setDate(ini.getDate()-1);
    return { ini, fim:agora, rot:'Hoje · desde '+hhmm(ini) };
  }
  if(p==='24h') return { ini:new Date(agora.getTime()-24*3600e3), fim:agora, rot:'Últimas 24 horas' };
  if(p==='7d')  return { ini:new Date(agora.getTime()-7*24*3600e3), fim:agora, rot:'Últimos 7 dias' };
  return { ini:new Date(0), fim:agora, rot:'Base completa' };
}

/* ============================================================
   AGREGAÇÃO — FPY, NOK, motivos, modelos, turnos e tendência
   ============================================================ */
function agregarPosto(key, regs, jan){
  const cfg = CFG.postos[key] || {};
  const lista = regs.filter(r=> r.posto===key && r.ts>=jan.ini && r.ts<=jan.fim);
  const st = {
    key, cfg, total:lista.length,
    testadas:0, ok1:0, nok1:0, fpy:0, retestes:0,
    pecas:0, aprovadas:0, refugo:0, yieldFinal:0,
    motivos:[], modelos:[], turnos:[], hist:[], ultimos:[],
    mediaVal:NaN, maxVal:NaN, limite: isFinite(numBR(cfg.limite))? numBR(cfg.limite) : NaN,
    unid: cfg.unid||'cc/min', ultimoNOK:null, ultimoTeste:null,
    cadencia:0, status:'off', atingimento:0,
  };
  if(!lista.length) return st;

  const vistos = new Set(), porPeca = new Map(), seq = [];
  const mMot = new Map(), mMod = new Map(), mTur = new Map();
  let somaVal=0, nVal=0;

  for(const r of lista){
    const idPeca = r.serie || '';
    const primeira = !r.reteste && (!idPeca || !vistos.has(idPeca));
    if(idPeca) vistos.add(idPeca);

    if(primeira){
      st.testadas++;
      seq.push(r.res);
      if(r.res==='OK') st.ok1++;
      else{
        st.nok1++;
        const mot = r.motivo || 'Não informado';
        mMot.set(mot, (mMot.get(mot)||0)+1);
      }
      const mod = r.modelo || '—';
      const om = mMod.get(mod) || {nome:mod, tot:0, nok:0};
      om.tot++; if(r.res==='NOK') om.nok++; mMod.set(mod, om);

      const tId = r.turno || turnoDe(r.ts).id;
      const ot = mTur.get(tId) || {nome:tId, tot:0, nok:0};
      ot.tot++; if(r.res==='NOK') ot.nok++; mTur.set(tId, ot);
    } else {
      st.retestes++;
      if(r.res==='NOK'){
        const mot = r.motivo || 'Não informado';
        mMot.set(mot, (mMot.get(mot)||0)+1);
      }
    }

    if(idPeca) porPeca.set(idPeca, r.res);
    if(isFinite(r.valor)){ somaVal += r.valor; nVal++; st.maxVal = isFinite(st.maxVal)? Math.max(st.maxVal, r.valor) : r.valor; }
    if(isFinite(r.limite) && !isFinite(st.limite)) st.limite = r.limite;
    if(r.unid) st.unid = r.unid;
    if(r.res==='NOK') st.ultimoNOK = r.ts;
    st.ultimoTeste = r.ts;
  }

  st.fpy = st.testadas? (st.ok1/st.testadas)*100 : 0;
  if(porPeca.size){
    st.pecas = porPeca.size;
    porPeca.forEach(v=>{ if(v==='OK') st.aprovadas++; else st.refugo++; });
  } else {
    st.pecas = st.testadas;
    st.aprovadas = st.ok1 + Math.max(0, lista.filter(r=>r.reteste && r.res==='OK').length);
    st.aprovadas = Math.min(st.aprovadas, st.pecas);
    st.refugo = Math.max(0, st.pecas - st.aprovadas);
  }
  st.yieldFinal = st.pecas? (st.aprovadas/st.pecas)*100 : 0;
  if(nVal){ st.mediaVal = somaVal/nVal; }

  const totNok = st.nok1 || 1;
  st.motivos = [...mMot.entries()].map(([nome,qtd])=>({nome, qtd, pct:(qtd/totNok)*100})).sort((a,b)=>b.qtd-a.qtd);
  st.modelos = [...mMod.values()].map(m=>({...m, fpy: m.tot? ((m.tot-m.nok)/m.tot)*100 : 0})).sort((a,b)=>b.tot-a.tot);
  st.turnos  = [...mTur.values()].map(m=>({...m, fpy: m.tot? ((m.tot-m.nok)/m.tot)*100 : 0})).sort((a,b)=>String(a.nome).localeCompare(String(b.nome)));

  const span = (st.ultimoTeste - lista[0].ts)/3600e3;
  st.cadencia = st.testadas / Math.max(0.25, span || 0.25);

  st.hist = tendencia(lista, jan);
  st.ultimos = seq.slice(-80);            // painel de lâmpadas do andon

  const meta = numBR(cfg.metaFpy) || 98, min = numBR(cfg.minFpy) || 95, maxNok = numBR(cfg.maxNok);
  st.atingimento = meta? clamp((st.fpy/meta)*100, 0, 100) : 0;
  if(!st.testadas) st.status='off';
  else if(st.fpy < min || (isFinite(maxNok) && st.nok1 > maxNok)) st.status='bad';
  else if(st.fpy < meta) st.status='warn';
  else st.status='ok';
  return st;
}
/* Tendência: FPY por bloco de tempo (12 blocos dentro da janela) */
function tendencia(lista, jan){
  if(!lista.length) return [];
  const N = 12;
  const ini = Math.max(jan.ini.getTime(), lista[0].ts.getTime());
  const fim = Math.max(jan.fim.getTime(), ini+1);
  const passo = (fim-ini)/N;
  const buckets = Array.from({length:N},()=>({tot:0,nok:0}));
  for(const r of lista){
    const i = clamp(Math.floor((r.ts.getTime()-ini)/passo), 0, N-1);
    if(r.reteste) continue;
    buckets[i].tot++; if(r.res==='NOK') buckets[i].nok++;
  }
  return buckets.map(b=>({ tot:b.tot, nok:b.nok, fpy: b.tot? ((b.tot-b.nok)/b.tot)*100 : NaN }));
}
function agregarTudo(regs, periodo){
  const jan = janela(periodo);
  const out = { jan, postos:{}, total:0, nokTotal:0 };
  for(const p of POSTOS){
    const st = agregarPosto(p.key, regs, jan);
    out.postos[p.key] = st;
    out.total += st.testadas; out.nokTotal += st.nok1;
  }
  return out;
}

/* ============================================================
   DADOS DE DEMONSTRAÇÃO (usados quando não há base ligada)
   ============================================================ */
function demoRegistros(){
  const modelos = { USI_BLOCO:['1.0','1.5','1.5 Turbo'], USI_CABECOTE:['1.0','1.5','1.5 Turbo'],
                    MON_ZERO:['1.0','1.5','1.5 Turbo'], MON_WATER:['1.0','1.5','1.5 Turbo'] };
  const perfil = { USI_BLOCO:{fpy:97.6, pph:46, lim:5},  USI_CABECOTE:{fpy:96.4, pph:44, lim:4},
                   MON_ZERO:{fpy:99.1, pph:38, lim:3},   MON_WATER:{fpy:98.2, pph:38, lim:6} };
  const regs=[]; const agora=Date.now(); const dias=7;
  let seq = 1;
  for(const p of POSTOS){
    const pf = perfil[p.key], mots = MOTIVOS_PADRAO[p.key];
    for(let h=dias*24; h>=0; h--){
      const base = agora - h*3600e3;
      const d = new Date(base);
      if(d.getDay()===0) continue;                                  // domingo sem produção
      const hora = d.getHours();
      const carga = (hora>=6 && hora<22)? 1 : 0.55;
      const qtd = Math.round(pf.pph*carga*(0.8+Math.random()*0.4));
      const fpyHora = clamp(pf.fpy + (Math.random()*3-1.6) - (h<6?1.4:0), 88, 100);
      for(let i=0;i<qtd;i++){
        const ts = new Date(base + Math.floor(Math.random()*3600e3));
        const nok = (Math.random()*100) > fpyHora;
        const val = nok? pf.lim*(1.1+Math.random()*1.8) : pf.lim*(0.15+Math.random()*0.6);
        const serie = p.key.slice(0,3)+String(100000+seq++);
        regs.push({
          ts, posto:p.key, res: nok?'NOK':'OK',
          modelo: modelos[p.key][Math.floor(Math.random()*3)],
          serie, valor: +val.toFixed(2), limite: pf.lim, unid:'cc/min',
          motivo: nok? mots[Math.floor(Math.random()*mots.length)] : '',
          turno: turnoDe(ts).id, operador:'', maquina:'', reteste:false,
        });
        if(nok && Math.random()<0.7){                                // reteste após retrabalho
          const ts2 = new Date(ts.getTime()+22*60000);
          regs.push({ ts:ts2, posto:p.key, res: Math.random()<0.85?'OK':'NOK',
            modelo: regs[regs.length-1].modelo, serie, valor:+(pf.lim*0.5).toFixed(2), limite:pf.lim, unid:'cc/min',
            motivo:'', turno:turnoDe(ts2).id, operador:'', maquina:'', reteste:true });
        }
      }
    }
  }
  regs.sort((a,b)=>a.ts-b.ts);
  return regs;
}
function regsParaCSV(regs){
  const cab = ['data_hora','posto','modelo','serie','resultado','vazamento','limite','unidade','motivo','turno','reteste'];
  const fmt = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
                 +' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  const linhas = regs.map(r=>[fmt(r.ts), r.posto, r.modelo, r.serie, r.res,
    isFinite(r.valor)? String(r.valor).replace('.',',') : '',
    isFinite(r.limite)? String(r.limite).replace('.',',') : '',
    r.unid, r.motivo, r.turno, r.reteste?'S':'N'].join(';'));
  return cab.join(';')+'\n'+linhas.join('\n');
}

/* ============================================================
   ESTADO GLOBAL
   ============================================================ */
const ST = {
  regs:[], agregado:null,
  fonte:'—',            // servidor | arquivo | demonstração | cache
  arquivo:'',
  atualizadoEm:null, proximaEm:0, carregando:false,
  erro:'', ignorados:0,
  alarmes:{},           // key -> status anterior (para disparar som só na transição)
};

/* Cache local do último CSV lido (para o painel voltar populado após reboot) */
function salvarCache(texto, fonte, arquivo){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({texto:String(texto).slice(0,4_000_000), fonte, arquivo, em:Date.now()})); }catch(e){}
}
function lerCache(){
  try{ const raw=localStorage.getItem(CACHE_KEY); return raw? JSON.parse(raw) : null; }catch(e){ return null; }
}

function aplicarTexto(texto, fonte, arquivo){
  const {linhas} = parseCSV(texto);
  const {regs, ignorados} = normalizar(linhas);
  if(!regs.length) throw new Error('sem-registros');
  ST.regs = regs; ST.fonte = fonte; ST.arquivo = arquivo||''; ST.ignorados = ignorados;
  ST.atualizadoEm = new Date(); ST.erro='';
  return regs.length;
}

window.LK = { I, $, $$, esc, clamp, semAcento, nInt, n1, n2, hhmm, dtBR, numBR, duracao, download, toast,

})();

<script>/* ============================================================

(function(){
"use strict";
const { I, $, $$, esc, clamp, nInt, n1, n2, hhmm, dtBR, numBR, duracao, download, toast,
        POSTOS, POSTO_BY, PERIODOS, cfg, cfgSalvar, cfgCarregarLocal, cfgPadrao, setCfg, mescla,
        Backend, agregarTudo, janela, demoRegistros, regsParaCSV, ST, aplicarTexto,

/* ============================================================
   ALARME SONORO
   ============================================================ */
const Som = {
  ctx:null,
  liberar(){ try{ if(!Som.ctx) Som.ctx = new (window.AudioContext||window.webkitAudioContext)(); if(Som.ctx.state==='suspended') Som.ctx.resume(); }catch(e){} },
  bipe(vezes=3){
    if(!cfg().alarme) return;
    Som.liberar(); if(!Som.ctx) return;
    for(let i=0;i<vezes;i++){
      const t0 = Som.ctx.currentTime + i*0.42;
      const osc = Som.ctx.createOscillator(), g = Som.ctx.createGain();
      osc.type='square'; osc.frequency.setValueAtTime(i%2? 660:880, t0);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.16, t0+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.3);
      osc.connect(g); g.connect(Som.ctx.destination);
      osc.start(t0); osc.stop(t0+0.32);
    }
  },
};

/* ============================================================
   CARREGAMENTO DA BASE
   ============================================================ */
function reiniciarContagem(){ ST.proximaEm = Math.max(30, (numBR(cfg().intervalo)||5)*60); }

async function carregar(manual=false){
  if(ST.carregando) return;
  ST.carregando = true; pintarStatus();
  const arq = cfg().arquivo || 'leak.csv';
  try{
    if(Backend.modo==='servidor'){
      const {texto} = await Backend.lerCSV(arq);
      const n = aplicarTexto(texto, 'servidor', arq);
      salvarCache(texto, 'servidor', arq);
      if(manual) toast(nInt(n)+' registros lidos de '+arq);
    } else if(ST.fonte==='arquivo'){
      ST.atualizadoEm = new Date();                       // arquivo carregado à mão: apenas recalcula
    } else if(ST.fonte!=='demonstração'){
      throw new Error('sem-servidor');
    }
  }catch(e){
    const cache = lerCache();
    if(ST.regs.length){
      ST.erro = e.message==='arquivo-ausente' ? 'Arquivo '+arq+' não encontrado na base' : 'Falha ao ler a base';
      if(manual) toast(ST.erro,'err');
    } else if(cache && cache.texto){
      try{ aplicarTexto(cache.texto,'cache',cache.arquivo); ST.erro='Exibindo a última leitura salva neste aparelho'; }
      catch(_){ usarDemo(); }
    } else {
      usarDemo();
    }
  }
  ST.carregando = false;
  reiniciarContagem();
  render();
}
function usarDemo(){
  ST.regs = demoRegistros();

/* ============================================================
   RENDER — COLUNAS DO ANDON

function estadoDe(st){
  const c = st.cfg||{}, min = numBR(c.minFpy)||95;

/* Painel de lâmpadas: um quadrado por teste de 1ª passagem (verde OK / vermelho NOK) */
function lampadasHTML(ultimos, total=40){

    + Array.from({length:vazios},()=>'<i class="v"></i>').join('')

function colunaHTML(p, st){

          + '</b></div>'

    + '</div>'

function render(){
  const c = cfg();
  const ag = agregarTudo(ST.regs, c.periodo);
  ST.agregado = ag;

  const ativos = POSTOS.filter(p=> (c.postos[p.key]||{}).ativo!==false );
  const grade = $('#grade');
  grade.className = 'grade c'+clamp(ativos.length,1,5);
  grade.innerHTML = ativos.map(p=> colunaHTML(p, ag.postos[p.key])).join('')
    || '<div style="place-self:center;color:var(--faint);font-weight:800">Nenhum posto habilitado — abra as metas para ativar.</div>';
  $$('#grade .col').forEach(el=> el.onclick = ()=> modalDetalhes(el.dataset.posto));

  // alarme só na transição para crítico
  ativos.forEach(p=>{
    const st = ag.postos[p.key], ant = ST.alarmes[p.key];
    if(st.status==='bad' && ant!=='bad') Som.bipe(3);
    ST.alarmes[p.key] = st.status;
  });

  pintarStatus();
  desenharBotoes();
  desenharPeriodos();
}

/* ---------- Aviso no cabeçalho + barra de controle ----------
   Em operação normal o painel fica limpo: o aviso só aparece quando a base
   falha, envelhece ou o painel está em demonstração. */
function pintarStatus(){
  const c = cfg(), al = $('#alerta');
  const idade = ST.atualizadoEm? Date.now()-ST.atualizadoEm.getTime() : Infinity;
  const vencido = idade > Math.max(3*(numBR(c.intervalo)||5), 15)*60000;
  let cls='', txt='';
  if(ST.fonte==='demonstração'){ cls='aviso'; txt='Modo demonstração — sem base conectada'; }
  else if(ST.fonte==='cache'){ cls='err'; txt='Sem conexão com a base — leitura de '+hhmm(ST.atualizadoEm); }
  else if(ST.erro){ cls='err'; txt=ST.erro; }
  else if(vencido){ cls='aviso'; txt='Base sem atualização desde '+hhmm(ST.atualizadoEm); }
  al.className = 'alerta'+(txt? ' ver '+cls : '');
  al.innerHTML = txt? I.alert+'<span>'+esc(txt)+'</span>' : '';
  atualizarInfo();
}
function atualizarInfo(){
  const c = cfg(), ag = ST.agregado, el = $('#infoBase');
  if(!el) return;
  let dot='off', fonte='Local (sem base)';
  if(ST.fonte==='servidor'){ dot = ST.erro? 'err':''; fonte = ST.erro? 'Falha na base' : 'Conectado à base'; }
  else if(ST.fonte==='arquivo'){ dot=''; fonte='Arquivo: '+(ST.arquivo||'carregado'); }
  else if(ST.fonte==='cache'){ dot='err'; fonte='Última leitura salva'; }
  else if(ST.fonte==='demonstração'){ dot='off'; fonte='Demonstração'; }
  const mm = Math.floor(ST.proximaEm/60), ss = ST.proximaEm%60;
  el.innerHTML = '<i class="dot '+dot+'"></i>'
    + '<span>'+esc(fonte)+' · <b>'+esc(ST.arquivo || c.arquivo)+'</b>'
    + ' · '+esc(ag? ag.jan.rot : '—')
    + ' · <b>'+(ag? nInt(ag.total):'0')+'</b> testes · <b>'+(ag? nInt(ag.nokTotal):'0')+'</b> NOK'
    + ' · atualizado <b>'+hhmm(ST.atualizadoEm)+'</b>'
    + ' · próxima <b>'+(ST.carregando? 'lendo…' : String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0'))+'</b></span>';
  el.onclick = modalFonte;
}
function desenharBotoes(){
  const box = $('#phBtns');
  if(box.dataset.pronto){ atualizarBotoes(); return; }
  box.dataset.pronto='1';
  box.innerHTML = ''
    + '<button class="ib" id="btAtualizar" title="Atualizar agora (R)">'+I.refresh+'</button>'
    + '<button class="ib" id="btMetas" title="Metas por posto (T)">'+I.target+'</button>'
    + '<button class="ib" id="btDet" title="Registros do período (D)">'+I.list+'</button>'
    + '<button class="ib" id="btSom" title="Alarme sonoro (M)">'+I.bell+'</button>'
    + '<button class="ib" id="btFull" title="Tela cheia (F)">'+I.full+'</button>'
    + '<button class="ib" id="btCfg" title="Configurações (C)">'+I.cog+'</button>';
  $('#btAtualizar').onclick = ()=>{ Som.liberar(); carregar(true); };
  $('#btMetas').onclick = modalMetas;
  $('#btDet').onclick = ()=> modalDetalhes('');
  $('#btSom').onclick = ()=>{ const k=cfg(); k.alarme=!k.alarme; cfgSalvar(); if(k.alarme){ Som.liberar(); Som.bipe(1); } atualizarBotoes(); };
  $('#btFull').onclick = telaCheia;

function atualizarBotoes(){
  const c = cfg(), s = $('#btSom');
  if(s){ s.innerHTML = c.alarme? I.bell : I.bellOff; s.className = 'ib '+(c.alarme? 'on':'off'); }
  const a = $('#btAtualizar'); if(a) a.className = 'ib'+(ST.carregando? ' spin':'');

}
function desenharPeriodos(){
  const c = cfg(), seg = $('#segPeriodo');
  seg.innerHTML = PERIODOS.map(p=>'<button data-p="'+p.id+'" class="'+(c.periodo===p.id?'on':'')+'">'+p.lbl+'</button>').join('');

/* A barra de controle some sozinha: na TV o painel fica só com o conteúdo. */
let _timerBarra = null;
function mostrarBarra(){
  const b = $('#barra'); if(!b) return;
  b.classList.add('ver');
  clearTimeout(_timerBarra);
  _timerBarra = setTimeout(()=>{ if(!b.matches(':hover')) b.classList.remove('ver'); }, 5000);
}
['mousemove','touchstart','keydown','wheel'].forEach(ev=> document.addEventListener(ev, mostrarBarra, {passive:true}));

function telaCheia(){
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  else document.documentElement.requestFullscreen?.().catch(()=>toast('Tela cheia bloqueada pelo navegador','err'));
  setTimeout(atualizarBotoes,150);
}

function lerArquivo(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const n = aplicarTexto(r.result, 'arquivo', file.name);
      salvarCache(r.result, 'arquivo', file.name);
      fecharModal(); render(); toast(nInt(n)+' registros carregados de '+file.name);
    }catch(e){ toast('Não foi possível ler esse arquivo — confira as colunas','err'); }
  };
  r.onerror = ()=> toast('Falha ao abrir o arquivo','err');
  r.readAsText(file, 'utf-8');
}

    const linhas = POSTOS.map(p=>{ const s = ag.postos[p.key], k = s.cfg||{};
      return [p.nome, ag.jan.rot, s.testadas, s.ok1, s.nok1, n1(s.fpy), s.retestes, s.pecas, s.refugo, n1(s.yieldFinal),
        k.metaFpy, k.minFpy, k.maxNok, isFinite(s.mediaVal)? n2(s.mediaVal):'', isFinite(s.limite)? n1(s.limite):'', s.unid,
        (s.motivos[0]? s.motivos[0].nome+' ('+s.motivos[0].qtd+')' : '')].join(';'); });
    download('leak-resumo.csv', cab+'\n'+linhas.join('\n'));
  };
  pinta();
}

/* ============================================================
   TEMA, RELÓGIO E CICLO DE ATUALIZAÇÃO
   ============================================================ */
function aplicarTema(){
  const c = cfg();
  if(c.escala && c.escala!=='auto') document.documentElement.dataset.esc = c.escala;
  else delete document.documentElement.dataset.esc;
}
function tique(){
  if(!ST.carregando){
    ST.proximaEm = Math.max(0, ST.proximaEm-1);
    if(ST.proximaEm===0) carregar(false);
  }
  atualizarInfo();
  if(ST.atualizadoEm && $('#alerta').className==='alerta') pintarStatus();   // reavalia base envelhecida
}

/* ---------- Atalhos de teclado ---------- */
document.addEventListener('keydown', e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if(k==='escape') return fecharModal();
  if(k==='r'){ Som.liberar(); carregar(true); }
  else if(k==='f') telaCheia();
  else if(k==='m'){ const c=cfg(); c.alarme=!c.alarme; cfgSalvar(); atualizarBotoes(); toast('Alarme '+(c.alarme?'ligado':'desligado'),'info'); }
  else if(k==='c') modalConfig();
  else if(k==='t') modalMetas();
  else if(k==='d') modalDetalhes('');
  else if(/^[1-5]$/.test(k)){ const p = PERIODOS[+k-1]; if(p){ cfg().periodo=p.id; cfgSalvar(); render(); } }
});
document.addEventListener('fullscreenchange', atualizarBotoes);
document.addEventListener('click', ()=> Som.liberar(), {once:true});

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
(async function iniciar(){
  $('#marca').innerHTML = I.drop;
  cfgCarregarLocal();
  aplicarTema();
  setInterval(tique, 1000);
  mostrarBarra();

  await Backend.init();
  if(Backend.modo==='servidor'){
    const remota = await Backend.lerCfg();
    if(remota) setCfg(mescla(cfg(), remota));
    aplicarTema();
  }
  reiniciarContagem();
  await carregar(false);

  // Recarrega ao voltar para a aba se a leitura estiver vencida
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden && ST.atualizadoEm && (Date.now()-ST.atualizadoEm.getTime()) > (numBR(cfg().intervalo)||5)*60000) carregar(false);
  });
})();
})();
</script>
